name: reusable-ci

# Called by each repository's ci.yml. One Ubuntu job: the ci-gate action picks the suites of the
# tier whose inputs have no passed run, the setups run only when it picked any, ci/run.ps1 runs
# them, and the keys of the suites that passed are recorded.
on:
  workflow_call:
    inputs:
      tier:
        description: quick or full
        type: string
        default: quick
      force:
        description: Also run suites whose inputs already have a passed run; manual runs only
        type: boolean
        default: false
      python-version:
        description: Python to set up; empty for none
        type: string
        default: ''
      dotnet-version:
        description: .NET SDK to set up; empty for none
        type: string
        default: ''
      java-version:
        description: Temurin JDK to set up; empty for none
        type: string
        default: ''
      node-version:
        description: Node to set up; empty for none
        type: string
        default: ''
      pester-version:
        description: Pester to install for the current user; empty for none
        type: string
        default: ''
      fetch-depth:
        description: Commits of history to check out; 0 for all
        type: number
        default: 1
      artifacts:
        description: Paths uploaded when a suite fails; empty for none
        type: string
        default: ''
      timeout-minutes:
        description: Job timeout
        type: number
        default: 20

permissions:
  contents: read
  actions: read

jobs:
  ci:
    name: ${{ inputs.tier }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}

      - id: gate
        uses: ./.github/actions/ci-gate
        with:
          tier: ${{ inputs.tier }}
          force: ${{ inputs.force }}

      - if: steps.gate.outputs.suites != '' && inputs.python-version != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      - if: steps.gate.outputs.suites != '' && inputs.dotnet-version != ''
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - if: steps.gate.outputs.suites != '' && inputs.java-version != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - if: steps.gate.outputs.suites != '' && inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - id: pester
        if: steps.gate.outputs.suites != '' && inputs.pester-version != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/powershell/Modules/Pester
          key: pester-${{ inputs.pester-version }}

      - if: steps.gate.outputs.suites != '' && inputs.pester-version != '' && steps.pester.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          PESTER_VERSION: ${{ inputs.pester-version }}
        run: Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser -SkipPublisherCheck

      # A repository's own setup (toolchains, caches, images) lives in .github/actions/ci-setup.
      - if: steps.gate.outputs.suites != '' && hashFiles('.github/actions/ci-setup/action.yml') != ''
        uses: ./.github/actions/ci-setup

      - id: run
        if: steps.gate.outputs.suites != ''
        shell: pwsh
        env:
          SUITES: ${{ steps.gate.outputs.suites }}
          RECORD: ${{ steps.gate.outputs.record }}
        run: |
          pwsh -NoProfile -File ci/run.ps1 -Suite $env:SUITES | Tee-Object -Variable results
          $code = $LASTEXITCODE
          $passed = @(foreach ($line in $results) { if ($line -match '^passed (\S+)') { $Matches[1] } })
          $pairs = @($env:RECORD.Substring('ci-done-'.Length) -split '_' | Where-Object { ($_ -split '\.')[0] -in $passed })
          $record = if ($pairs) { 'ci-done-' + ($pairs -join '_') } else { '' }
          "code=$code" >> $env:GITHUB_OUTPUT
          "record=$record" >> $env:GITHUB_OUTPUT
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/ci-done" | Out-Null
          Set-Content -LiteralPath "$env:RUNNER_TEMP/ci-done/record" -Value ($passed -join ',')
          exit 0

      - if: steps.run.outputs.record != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-done
          key: ${{ steps.run.outputs.record }}

      - if: steps.run.outputs.code == '3' && inputs.artifacts != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ inputs.tier }}-${{ github.run_id }}
          path: ${{ inputs.artifacts }}
          retention-days: 5

      - if: steps.run.outputs.code != '' && steps.run.outputs.code != '0'
        shell: pwsh
        env:
          CODE: ${{ steps.run.outputs.code }}
        run: exit [int] $env:CODE
