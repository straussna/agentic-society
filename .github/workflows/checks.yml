name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: no-docker lane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      # The suite imports nothing outside the standard library. This step is
      # here to check the declared dependencies still resolve on a clean box.
      - run: pip install -r requirements.txt
      # No key, nothing billed: the suite runs against a fake API.
      - run: python check.py --no-docker
      # The same checks under pytest, the runner coverage tools drive.
      - run: pip install pytest
      - run: python -m pytest checks

  full:
    name: all checks, in containers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - run: docker build -t metered-agent:latest .
      # Without the image the container checks skip and the run still passes
      # with only the host lane proved.
      - run: docker image inspect metered-agent:latest > /dev/null
      # -j 2: the two wall-clock-sensitive checks are in this lane.
      - run: python check.py -j 2
