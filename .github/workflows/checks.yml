name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: no-docker (165 checks, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The suite imports nothing outside the standard library. This step is
      # here to check the declared dependencies still resolve on a clean box.
      - run: pip install -r requirements.txt
      # No key, nothing billed: the suite runs against a fake API.
      - run: python check.py --no-docker

  full:
    name: all 186 checks, in containers
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: docker build -t metered-agent:latest .
      # Without the image the 21 container checks skip and the run still
      # passes, having proved 165 things rather than 186.
      - run: docker image inspect metered-agent:latest > /dev/null
      # -j 2: the two wall-clock-sensitive checks are in this lane.
      - run: python check.py -j 2
