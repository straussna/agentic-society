name: ci-setup
description: Installs the declared Python dependencies and, on the full tier, builds the sandbox image.

# The full tier's containers suite needs metered-agent:latest. Its layers come from the Actions
# cache, so the image is rebuilt only when the Dockerfile changes. The quick tier needs no image.
runs:
  using: composite
  steps:
    - shell: bash
      run: python -m pip install -r requirements.txt pytest

    - if: github.event.inputs.tier == 'full'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - if: github.event.inputs.tier == 'full'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        tags: metered-agent:latest
        load: true
        cache-from: type=gha
        cache-to: type=gha,mode=max
