<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agentic-society</title>
<meta name="interaction-control-token" content="__INTERACTION_CONTROL_TOKEN__">
<style>
/* Dark only, and low contrast on purpose: this is a page left open beside an agent
   for hours. Fira Code is the numbers and everything the agent wrote - a balance
   has to line up column-wise against the one above it - and Fira Sans is the
   chrome around them. Both are named first and degrade to whatever the machine
   has; nothing is fetched, because a page that fetched a font would be a page
   that needs a network. */
:root {
  --bg:#080b10; --sunk:#06080c; --panel:#10151c; --panel2:#141b24; --raise:#18212b;
  --line:#202a36; --line2:#314052;
  --ink:#e5e9ef; --dim:#a0aab7; --faint:#687586;
  --accent:#78b7e6; --accent2:#9a87e8; --live:#8fcf9f; --warn:#e2b86f;
  --bad:#e28b84; --starter:#ba9bd1;
  --glow:0 12px 38px rgba(0,0,0,.28),0 0 0 1px rgba(120,183,230,.025);
  --sans:"Fira Sans","Fira Sans Condensed",Inter,"Segoe UI Variable Text","Segoe UI",
         system-ui,sans-serif;
  --mono:"Fira Code","Cascadia Mono",Consolas,ui-monospace,monospace;
  --r:10px;
}
* { box-sizing:border-box; }
html { color-scheme:dark; height:100%; }
body.resizing { cursor:col-resize; user-select:none; }
body.resizing.rows { cursor:row-resize; }
body { margin:0; height:100%; background:
       radial-gradient(circle at 78% -20%,rgba(82,112,172,.16),transparent 42%),var(--bg); color:var(--ink);
       font:400 14px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
::selection { background:rgba(127,155,176,.28); }
::-webkit-scrollbar { width:11px; height:11px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line2); border-radius:7px;
                            border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:var(--faint); background-clip:content-box; }

h2 { margin:16px 0 8px; font:600 11.5px/1 var(--sans); letter-spacing:.16em;
     text-transform:uppercase; color:var(--faint); }
.num { font-family:var(--mono); font-variant-numeric:tabular-nums; }
.note { color:var(--faint); font-size:12.5px; margin:0; }
.empty { color:var(--faint); padding:28px 0; text-align:center; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:var(--r);
         padding:12px 14px; box-shadow:var(--glow); }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(205px,1fr)); gap:16px 22px; }
.kv .k { color:var(--faint); font:500 11.5px/1 var(--sans); letter-spacing:.09em;
         text-transform:uppercase; }
.kv .v { font:400 13px/1.5 var(--mono); color:var(--dim); overflow-wrap:anywhere; margin-top:5px; }
.dot { width:6px; height:6px; border-radius:50%; display:inline-block; background:currentColor;
       animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity:.2; } }
.tag { font:500 11.5px/1.5 var(--sans); letter-spacing:.03em; padding:2px 9px; border-radius:999px;
       border:1px solid var(--line2); color:var(--dim); display:inline-flex; gap:5px;
       align-items:center; white-space:nowrap; }
.tag.live { color:var(--live); border-color:rgba(143,168,125,.38); background:rgba(143,168,125,.08); }
.tag.bad  { color:var(--bad);  border-color:rgba(189,128,120,.38); background:rgba(189,128,120,.08); }
.tag.warn { color:var(--warn); border-color:rgba(194,160,107,.38); background:rgba(194,160,107,.08); }
.tag.starter { color:var(--starter); border-color:rgba(156,139,171,.38); background:rgba(156,139,171,.08); }
/* The channels the agent writes for someone else to read. Its peers, its inboxes,
   the balances and the ledger keep the plain tag: they are the environment, not this
   agent's doing. */
.tag.edit { color:var(--accent); border-color:rgba(127,155,176,.38); background:rgba(127,155,176,.08); }
.bar { height:3px; background:var(--line); border-radius:2px; margin:7px 0 6px; overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); transition:width .3s ease; }
.bar.over i { background:var(--bad); }
button, input { font:inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline:2px solid var(--accent); outline-offset:2px;
}

/* --- the header, which every tab is read under --- */
/* The page is the window: a column of a fixed header over one channel that takes
   what is left. Every pane sizes itself against that channel and not against
   the viewport, so the only scrollbar on screen belongs to whatever is being
   read. */
#page { height:100dvh; display:flex; flex-direction:column; padding:0 22px; }
#top { flex:0 0 auto; position:sticky; top:0; z-index:10; background:rgba(8,11,16,.94);
       border-bottom:1px solid var(--line); backdrop-filter:blur(18px); }
.appbar { min-height:54px; display:flex; align-items:center; gap:12px; }
.brand { display:flex; align-items:center; gap:10px; flex:0 0 auto; }
.brand .mark { width:9px; height:9px; border-radius:50%; background:var(--accent);
  box-shadow:0 0 16px rgba(120,183,230,.9); }
.brand b { font:600 15px/1 var(--mono); letter-spacing:.01em; }
.who { min-width:0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.who .sub { color:var(--dim); font-size:12.5px; }
.picks { display:flex; gap:6px; flex-wrap:wrap; }
.filt { padding:4px 10px; border:1px solid var(--line2); border-radius:999px; cursor:pointer;
        background:transparent; color:var(--dim); font:500 12px/1.4 var(--sans);
        letter-spacing:.02em; transition:color .12s ease, border-color .12s ease,
        background .12s ease; }
.filt:hover { color:var(--ink); border-color:var(--faint); }
.filt.on { color:var(--ink); border-color:var(--accent); background:rgba(127,155,176,.14); }
.filt em { font-style:normal; color:var(--faint); margin-left:5px; }

.fold { margin-left:auto; padding:6px 11px; min-height:34px; border:1px solid var(--line2); border-radius:999px;
        cursor:pointer; background:transparent; color:var(--faint);
        font:500 11.5px/1.5 var(--sans); letter-spacing:.02em; }
.fold:hover { color:var(--ink); border-color:var(--faint); }

.overview { padding:2px 0 10px; min-height:0; max-height:min(48vh,420px); overflow:auto; }
.overview.sized { height:var(--overview-height); max-height:70vh; }
.metrics { display:grid; grid-template-columns:repeat(5,minmax(130px,1fr)); gap:8px; margin-bottom:10px; }
.metric { min-width:0; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r);
          background:linear-gradient(145deg,var(--panel2),var(--panel)); box-shadow:var(--glow); }
.metric .k { color:var(--faint); font:500 10.5px/1 var(--sans); letter-spacing:.11em;
             text-transform:uppercase; }
.metric .v { margin-top:7px; color:var(--ink); font:500 18px/1 var(--mono);
             font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.metric .s { margin-top:5px; color:var(--faint); font-size:11.5px; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis; }
.metric.attn .v { color:var(--warn); }
.board { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,22%); gap:14px; align-items:stretch; }
.seats { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:1px;
         background:var(--line); border:1px solid var(--line); border-radius:var(--r);
         overflow:hidden; box-shadow:var(--glow); }
.tile { background:linear-gradient(145deg,var(--panel2),var(--panel)); padding:11px 13px 12px; min-width:0; }
.tile.idle { background:var(--sunk); }
.tile .k { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
           color:var(--faint); font:500 11px/1 var(--sans); letter-spacing:.11em;
           text-transform:uppercase; }
/* An agent id is a name, not a label, so it keeps the letters it was given. */
.tile .k b { color:var(--dim); font:600 11px/1 var(--mono); letter-spacing:.02em;
             text-transform:none; }
.tile .v { margin-top:8px; font:500 21px/1 var(--mono); font-variant-numeric:tabular-nums; }
.tile .v.neg { color:var(--bad); }
/* One wrapping row, so a seat carrying a transfer and a stop is no taller than a
   seat carrying neither. */
.tile .m { color:var(--dim); font-size:12px; display:flex; gap:6px 9px; flex-wrap:wrap;
           align-items:center; margin-top:5px; }
.tile .m i { font-style:normal; color:var(--line2); }
.tile .pinned { margin-top:8px; display:flex; gap:5px; flex-wrap:wrap; }
.tile .pinned .tag { max-width:100%; overflow:hidden; text-overflow:ellipsis; }

/* Collapsed, the header is the balances and the tabs: the rows under each
   number are the round's detail, and a reader watching a transcript is not
   reading them. */
#top.compact .overview { display:none; }
#top.compact .overview-resizer { display:none; }

.gbox { border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
        padding:12px 14px; box-shadow:var(--glow); }
.product-state { padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); }
.product-state .result { color:var(--dim); margin-top:7px; }
/* An experiment that has been trading for a while has a ledger longer than the
   seats beside it; it scrolls instead of setting how tall the header is. */
.gbox .led { max-height:150px; overflow-y:auto; margin-top:6px; }
.gbox td { padding:3px 12px 3px 0; border:0; }
.chart-block { margin-top:10px; }
.election { padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); }
.election .result { color:var(--dim); margin-top:7px; }
.tally { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
#tabs { display:flex; gap:3px; overflow-x:auto; scrollbar-width:none; }
.tab { padding:10px 14px 11px; min-height:40px; border:0; border-bottom:2px solid transparent; cursor:pointer;
       background:transparent; color:var(--faint); font:500 13.5px/1 var(--sans);
       letter-spacing:.02em; }
.tab:hover { color:var(--ink); }
.tab.on { color:var(--ink); border-bottom-color:var(--accent); }
.tab em { font-style:normal; color:var(--faint); margin-left:7px; font-size:12px; }
.overview-resizer { height:7px; margin:0 -4px; cursor:row-resize; position:relative; touch-action:none; }
.overview-resizer::after { content:""; position:absolute; left:4px; right:4px; top:3px; height:1px;
  background:var(--line); transition:background .12s ease,box-shadow .12s ease; }
.overview-resizer:hover::after, .overview-resizer.dragging::after { background:var(--accent);
  box-shadow:0 0 8px rgba(120,183,230,.45); }
/* What is left of the window after the header. Nothing inside it may grow the
   page: a pane that wants more room scrolls itself. */
#body { flex:1 1 auto; min-height:0; overflow:hidden; padding:12px 0 16px;
        display:flex; flex-direction:column; }
#body > * { min-height:0; }
/* A tab that fills the channel: its own column, with one child taking the slack. */
.fill { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }

/* --- the message log, read as the chat it is --- */
.round { display:flex; align-items:center; gap:12px; margin:14px 0 8px; color:var(--faint);
         font:500 11.5px/1 var(--sans); letter-spacing:.16em; text-transform:uppercase; }
.round i { flex:1; height:1px; background:var(--line); }
.chat { flex:1 1 auto; min-height:0; display:grid;
        grid-template-columns:minmax(220px,var(--split,310px)) 7px minmax(0,1fr);
        gap:6px; align-items:stretch; }
.chat.narrow { grid-template-columns:44px minmax(0,1fr); gap:12px; }
.chat.narrow .splitter { display:none; }
.chat.narrow .pair .p, .chat.narrow .pair .t em { display:none; }
.chat.narrow .pair-tools { display:none; }
.chat.narrow .pair { padding:9px 6px; text-align:center; }
.chat.narrow .pair .t { justify-content:center; }
.chat.narrow .pair .nm b { display:block; }
.pairs { border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
         min-height:0; overflow-y:auto; box-shadow:var(--glow); }
.pair-tools { position:sticky; top:0; z-index:2; padding:10px; border-bottom:1px solid var(--line);
  background:rgba(16,21,28,.96); backdrop-filter:blur(12px); }
.search { width:100%; min-height:38px; border:1px solid var(--line2); border-radius:8px;
  background:var(--sunk); color:var(--ink); padding:7px 10px; }
.search-wrap { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px; align-items:center; }
.search-clear { width:38px; height:38px; border:1px solid var(--line2); border-radius:8px;
  background:transparent; color:var(--dim); cursor:pointer; }
.search-clear:hover { color:var(--ink); border-color:var(--accent); }
.pair-options { display:flex; justify-content:space-between; gap:8px; align-items:center;
  margin-top:8px; color:var(--faint); font-size:12px; }
.pair { display:block; width:100%; text-align:left; padding:11px 13px; cursor:pointer;
        background:transparent; border:0; border-bottom:1px solid var(--line);
        font:400 14px/1.5 var(--sans); transition:background .12s ease; }
.pair:last-child { border-bottom:0; }
.pair:hover { background:var(--raise); }
.pair.on { background:var(--raise); box-shadow:inset 2px 0 0 var(--accent); }
.pair.mute { opacity:.5; }
.pair .t { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.pair .t .nm { font:400 13.5px/1.3 var(--mono); color:var(--ink); }
.pair .t em { font-style:normal; font:400 11.5px/1.3 var(--sans); color:var(--faint); }
.pair .p { margin-top:4px; font-size:12.5px; color:var(--faint);
           overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.thread { border:1px solid var(--line); border-radius:var(--r); background:var(--panel);
          min-width:0; min-height:0; display:flex; flex-direction:column; box-shadow:var(--glow); }
.thead { padding:9px 14px; border-bottom:1px solid var(--line);
         display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.thead .nm { font:400 14px/1.4 var(--mono); }
#thread { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-anchor:none;
          padding:2px 14px 12px; }
#thread .round:first-child { margin-top:12px; }
/* A log, not a chat: a message takes the width it is given, and which way it
   went is said in its header and not by which side it sits on. */
.msg { margin-top:8px; }
.msg .mh { display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; margin-bottom:3px;
           color:var(--faint); font-size:12px; }
.msg .mh b { font:400 13px/1.4 var(--mono); font-weight:400; }
.msg .bub { border:1px solid var(--line2); border-radius:8px;
            background:var(--raise); padding:7px 11px; }
.msg.r .bub { border-left:2px solid var(--line2); }
.msg.tip .bub { border-style:dashed; background:var(--sunk); }
.msg.same .bub { opacity:.62; }
.msg .bub pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink);
                font:400 13px/1.55 var(--mono); }
.sec { border-top:1px solid var(--line); }
.sec summary { cursor:pointer; padding:5px 0; color:var(--faint); font-size:12px;
  font-family:var(--mono); }
.sec summary i { color:var(--ink); font-style:normal; }
.sec[open] summary { color:var(--ink); }
.sec pre.out { margin-bottom:7px; }
.msg .bub details { margin-top:7px; }
.msg .bub summary { cursor:pointer; color:var(--faint); font-size:12px; }
.msg .bub details pre { margin-top:6px; padding:7px 10px; background:var(--sunk);
                        border-radius:8px; color:var(--dim); }
.msg .ft { margin-top:3px; color:var(--faint); font-size:12px; }
.sys { margin-top:10px; text-align:center; color:var(--faint); font-size:12.5px; }
.sys b { font:400 12.5px/1.5 var(--mono); font-weight:400; }
.board-view { flex:1 1 auto; min-height:0; }
.board-view .thead { justify-content:space-between; }
.board-view .group-title, .ballot-view .group-title { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.board-view .posters { display:flex; align-items:center; }
.board-view .poster { width:25px; height:25px; display:grid; place-items:center; margin-left:-5px;
  border:1px solid var(--line2); border-radius:50%; background:var(--raise); font:600 10px/1 var(--mono); }
.board-view .poster:first-child { margin-left:0; }
.board-view .msg { max-width:min(920px,92%); }
.board-view .msg .bub { border-left:2px solid var(--speaker,var(--accent)); }
.board-view .msg .mh b { font-weight:600; }
.ballot-view { flex:1 1 auto; min-height:0; }
.ballot-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px; }
.vote-tally { display:grid; gap:8px; margin-bottom:18px; }
.vote-result { display:grid; grid-template-columns:minmax(80px,160px) minmax(120px,1fr) auto;
  gap:12px; align-items:center; }
.vote-result .target { font:500 13px/1.3 var(--mono); }
.vote-result .count { color:var(--dim); font:500 13px/1 var(--mono); font-variant-numeric:tabular-nums; }
.vote-bar { height:8px; overflow:hidden; border-radius:999px; background:var(--sunk); }
.vote-bar i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--live)); }
.ballot-table { margin-top:8px; }
.ballot-table td:first-child { width:1%; white-space:nowrap; color:var(--ink); }
.ballot-table td:last-child { color:var(--dim); }

/* --- directory channels, side by side --- */
/* The listing is an index and stays a column a seat; what a file says is read
   below it, across the whole window, in as many columns as there are files
   open. A file's contents are the reason the tab exists, so they get the room. */
.treeview { flex:1 1 auto; min-height:0; display:grid;
  grid-template-columns:minmax(300px,var(--split,46%)) 7px minmax(360px,1fr); gap:6px; }
.splitter { min-width:7px; min-height:36px; cursor:col-resize; position:relative; touch-action:none; }
.splitter::after { content:""; position:absolute; top:0; bottom:0; left:3px; width:1px;
  background:var(--line); transition:background .12s ease,box-shadow .12s ease; }
.splitter:hover::after, .splitter.dragging::after { background:var(--accent);
  box-shadow:0 0 8px rgba(120,183,230,.45); }
.treeindex, .inspector { min-height:0; overflow-y:auto; }
.snapshotbar { display:flex; align-items:center; gap:10px; min-width:0; margin:0 0 10px;
  padding:9px 11px; border:1px solid var(--line); border-radius:var(--r); background:var(--panel); }
.snapshotbar .lbl { flex:0 0 auto; color:var(--faint); font-size:11.5px; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; }
.snapshots { display:flex; gap:6px; min-width:0; overflow-x:auto; padding:2px; scrollbar-width:thin; }
.snapshots .chip { flex:0 0 auto; }
.treeindex { border:1px solid var(--line); border-radius:var(--r); background:var(--panel); padding:12px; box-shadow:var(--glow); }
/* Both grids wrap instead of running off the side: a listing too narrow to read is
   no better than one that is not on screen. */
.cols { display:grid; gap:12px; align-items:start;
        grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); }
.col { border:1px solid var(--line); border-radius:var(--r); background:var(--panel2);
       min-width:0; }
.col .h { padding:9px 13px; border-bottom:1px solid var(--line);
          display:flex; gap:9px; align-items:baseline; flex-wrap:wrap; }
.col .h b { font:600 14px/1 var(--mono); }
.col .h span { color:var(--faint); font-size:12.5px; }
.col .b { padding:2px 13px 8px; }
.file-list { display:flex; flex-direction:column; padding:5px; }
.file-row { width:100%; min-height:46px; display:grid; grid-template-columns:minmax(0,1fr) auto;
  gap:10px; align-items:center; text-align:left; border:0; border-radius:7px; padding:7px 8px;
  background:transparent; color:var(--ink); cursor:pointer; }
.file-row:hover { background:var(--raise); }
.file-row.on { background:rgba(120,183,230,.11); box-shadow:inset 2px 0 var(--accent); }
.file-row .path { min-width:0; overflow-wrap:anywhere; font:400 13px/1.4 var(--mono); }
.file-row .meta { grid-column:1; color:var(--faint); font-size:11.5px; white-space:nowrap; }
.file-row > span:last-child { grid-column:2; grid-row:1 / span 2; }
.inspector { border:1px solid var(--line); border-radius:var(--r); background:var(--panel); box-shadow:var(--glow); }
.inspector.empty-inspector { display:grid; place-items:center; color:var(--faint); padding:28px; text-align:center; }
.inspector-head { position:sticky; top:0; z-index:1; display:flex; gap:12px; align-items:flex-start;
  padding:12px 14px; border-bottom:1px solid var(--line); background:rgba(16,21,28,.96); backdrop-filter:blur(12px); }
.inspector-title { min-width:0; flex:1; }
.inspector-title b { display:block; overflow-wrap:anywhere; font:600 13px/1.4 var(--mono); }
.inspector-title span { color:var(--faint); font-size:12px; }
.icon-btn { width:36px; height:36px; flex:0 0 auto; border:1px solid var(--line2); border-radius:8px;
  background:transparent; color:var(--dim); cursor:pointer; }
.icon-btn:hover { color:var(--ink); border-color:var(--accent); background:var(--raise); }
.inspector-body { padding:14px; }
.file-content { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink); font:400 13px/1.6 var(--mono); }

table { border-collapse:collapse; width:100%; font:400 13px/1 var(--mono); }
td, th { text-align:left; padding:6px 12px 6px 0; border-bottom:1px solid var(--line); }
tr:last-child td { border-bottom:0; }
th { color:var(--faint); font:500 11.5px/1 var(--sans); letter-spacing:.11em; text-transform:uppercase; }
td.sz { color:var(--faint); font-variant-numeric:tabular-nums; text-align:right;
        width:1%; white-space:nowrap; }

<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>\u0022\u0027]/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (n) => n == null ? "–" : Number(n).toLocaleString();
const get = (u) => fetch(u).then(r => r.ok ? r.json() : Promise.reject(r.status));
let CONTROL_TOKEN = document.querySelector('meta[name="interaction-control-token"]').content;
async function post(u, value, retry = true) {
  const response = await fetch(u, {method:"POST", headers:{"Content-Type":"application/json",
    "X-Interaction-Token":CONTROL_TOKEN}, body:JSON.stringify(value)});
  const body = await response.json();
  if (response.status === 403 && retry && body.error === "control token required") {
    const page = await fetch("/", {cache:"no-store"}).then(result => result.text());
    const fresh = new DOMParser().parseFromString(page, "text/html")
      .querySelector('meta[name="interaction-control-token"]')?.content;
    if (fresh && fresh !== CONTROL_TOKEN) {
      CONTROL_TOKEN = fresh;
      return post(u, value, false);
    }
  }
  if (!response.ok) throw new Error(body.error || String(response.status));
  return body;
}
const shortPath = (s) => String(s || "").split(/[\\/]/).filter(Boolean).pop() || "";
// One provenance answer as a line. Lists and an experiment's
// seating is a mapping, and both read as what they are, not as JSON.
const provValue = (v) => Array.isArray(v) ? v.join(", ")
  : v && typeof v === "object"
    ? (Object.entries(v).map(([k, r]) => `${k} ${r}`).join(" · ") || "none")
  : String(v);

// What a silence penalty took, which is a separate question from whether the episode
// was silent.
const charged = (n) => n ? ` · penalised ${num(n)}`
  : ` · <span title="a share is taken only from an episode the API answered,
     past the grace, at a rate above zero">charged nothing</span>`;

// What the page is folded down to is the reader's, not the agent's, so it is kept
// where a reload can find it again.
const held = (k, dflt) => { try { const v = localStorage.getItem(k);
  return v == null ? dflt : v === "1"; } catch (e) { return dflt; } };
const hold = (k, v) => { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} };
const heldNumber = (k) => { try { const v = Number(localStorage.getItem(k));
  return Number.isFinite(v) && v > 0 ? v : null; } catch (e) { return null; } };
const holdNumber = (k, v) => { try { localStorage.setItem(k, String(Math.round(v))); } catch (e) {} };

// --- where the reader left each box --------------------------------------

// How far a box is from its end, in pixels.
function behind(b) { return b.scrollHeight - b.scrollTop - b.clientHeight; }

// At the end means there is something to scroll and the reader is against the
// bottom of it. A box with nothing to scroll is not at its end, so filling one
// carries the reader nowhere.
const NEAR = 40;
const atEnd = (b) => b.scrollHeight > b.clientHeight && behind(b) < NEAR;

// Every box the page can be scrolled in. A pane is drawn by replacing its
// nodes, and the new nodes carry none of the scroll the old ones had.
const BOXES = "#tx, #thread, .pairs, .treeindex, .inspector, .led, .snapshots";
const boxesIn = (el) =>
  (el.matches(BOXES) ? [el] : []).concat([...el.querySelectorAll(BOXES)]);

// Everything #body holds is drawn against a signature kept on #body itself, so
// whatever replaces the pane drops the signature with it. A renderer comparing
// against a signature whose markup is gone takes the pane for already drawn.
function blank(el, html) { el.dataset.sig = ""; el.innerHTML = html; return el; }

// Write `html` into `el`, leaving every box inside it where its reader had it:
// one against the end stays against the end as content arrives, and every other
// one keeps the offset it was read at. Boxes are matched across the write by
// the order they are written in, so a pane that grows at its end hands each box
// back its own place.
function redraw(el, html) {
  const was = boxesIn(el).map(b => [b.scrollTop, b.scrollLeft, atEnd(b)]);
  el.innerHTML = html;
  boxesIn(el).forEach((b, i) => {
    const had = was[i];
    if (!had) return;
    b.scrollTop = had[2] ? b.scrollHeight : had[0];
    b.scrollLeft = had[1];
  });
}

const S = { experiments: [], experiment: null, head: null, tab: "mailbox",
            // The message log is append-only, so what is held is extended
            // and not re-fetched; the tip is whatever is ahead of it.
            msgs: [], tips: [], msgn: 0, standing: false, pair: null,
            mailboxQuery: "", mailboxTimer: null, showEmpty: held("show-empty-pairs", false),
            tree: {}, treeRound: {}, inspect: {}, body: {},
            // One agent's transcript, and how many of its turns are drawn.
            agent: null, detail: null, episode: null, view: null,
            since: 0, source: null, drawn: 0, tail: true,
            // Where the transcript is being read, held here and not in the
            // pane, because the pane is replaced under it.
            txtop: 0, txend: false,
            // How much of the header, and of the thread list, is shown.
            compact: held("compact", false), rail: held("rail", false),
            overviewHeight: heldNumber("overview-height"),
            mailboxWidth: heldNumber("mailbox-width") || 310,
            treeWidth: heldNumber("tree-width"),
            interaction: null, interactionId: null, interactionSubmitted: false,
            humanExperiment: null, humanExperimentAgent: null,
            humanMode: held("human-mode", false),
            poll: 1500, stale: 180 };

const PENDING = "output arrives when the episode ends";

const ago = (s) => s == null ? "" : s < 90 ? `${Math.round(s)}s ago`
  : s < 5400 ? `${Math.round(s / 60)}m ago` : `${(s / 3600).toFixed(1)}h ago`;
const running = (d) => d && d.running_episode != null && d.live_age != null
  && d.live_age < S.stale;
// Every seat tile of the experiment on the page, and one of them by its number.
const seatTiles = () => S.head ? S.head.seat_tiles : [];
const seatOf = (n) => seatTiles().find(x => String(x.seat) === String(n));
const seatName = (n) => {
  const s = seatOf(n) || seatTiles().find(x => x.label === n);
  return s ? s.agent : null;
};
// What the other agents call a seat: its balance file, which is the balance
// file's name and then the seat's label.
const nameOf = (seat) => {
  const h = S.head || {};
  return (h.balance || "") + ((h.labels || {})[seat] || seat);
};
// The same name, from a label: what a ballot and an election's tally hold.
const labelName = (label) => ((S.head || {}).balance || "") + label;
// One line of a diff, classed by what it did.
const diffLine = (l) => `<span class="${l[0] === "+" ? "a" : l[0] === "-" ? "d" : "h"}">${esc(l)}</span>`;

function expandableHtml(text, classes="out", label="output") {
  const value = String(text == null ? "" : text);
  const lines = value.split("\n").length;
  const long = value.length > 3600 || lines > 28;
  return `<div class="expandable ${long ? "collapsed" : ""}"><pre class="${classes}">${esc(value)}</pre>${long
    ? `<button class="expand" data-expand aria-expanded="false">Show full ${esc(label)} · ${num(lines)} lines</button>` : ""}</div>`;
}

// --- little svg ----------------------------------------------------------

// Folded, not spread: a long-lived agent's series runs to thousands of elements,
// and Math.max(...s) on one of those is an argument list, not a loop. The floor
// is held at zero so a balance that never moves still has a scale, and one that
// went negative is drawn below the line instead of filling the box.
const hiOf = (s) => s.reduce((a, b) => b > a ? b : a, -Infinity);
const loOf = (s) => s.reduce((a, b) => b < a ? b : a, 0);

// `lo`, `hi` and `n` are given when several series share one picture: without
// them each would be drawn against its own scale and its own length, and two
// seats that spent differently would look alike.
function path(series, w, h, pad, lo, hi, n) {
  if (series.length < 2) return "";
  if (lo == null) { lo = loOf(series); hi = hiOf(series); }
  const span = (hi - lo) || 1, den = ((n || series.length) - 1) || 1;
  return series.map((v, i) => {
    const x = pad + i * (w - 2 * pad) / den;
    const y = pad + (h - 2 * pad) * (1 - (v - lo) / span);
    return (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
  }).join(" ");
}

const INK = ["var(--accent)", "var(--live)", "var(--warn)", "var(--starter)", "var(--bad)"];
const inkOf = (i) => INK[i % INK.length];

// Every seat on one scale, which is the comparison a chart of one agent cannot
// make: who is ahead, and where the lines crossed.
function overlay(tiles) {
  const all = tiles.flatMap(s => s.balance_history || []);
  if (all.length < 2) return `<div class="note">no turns yet</div>`;
  const lo = loOf(all), hi = hiOf(all);
  const n = tiles.reduce((a, s) => Math.max(a, (s.balance_history || []).length), 0);
  const lines = tiles.map((s, i) => {
    const d = path(s.balance_history || [], 240, 54, 3, lo, hi, n);
    return d ? `<path d="${d}" fill="none" stroke="${inkOf(i)}" stroke-width="1.25"
      opacity=".85" vector-effect="non-scaling-stroke"/>` : "";
  }).join("");
  const zero = lo < 0 ? `<line x1="0" x2="240" y1="${(3 + 48 * (1 - (0 - lo) / ((hi - lo) || 1))).toFixed(1)}"
     y2="${(3 + 48 * (1 - (0 - lo) / ((hi - lo) || 1))).toFixed(1)}" stroke="var(--bad)"
     stroke-width="1" opacity=".5"/>` : "";
  return `<svg width="100%" height="54" viewBox="0 0 240 54" preserveAspectRatio="none"
    >${zero}${lines}</svg>`;
}

function renderPicks() {
  const el = document.getElementById("picks");
  // One experiment is not a choice between experiments.
  if (S.experiments.length < 2) { el.innerHTML = ""; return; }
  const why = (c) => c.seated ? `${c.seats.length} seated` : "no seating: no board or mailbox between them";
  el.innerHTML = S.experiments.map(c => `<button class="filt ${c.experiment_id === S.experiment ? "on" : ""}"
      data-c="${esc(c.experiment_id)}" aria-pressed="${c.experiment_id === S.experiment}" title="${esc(why(c))}">${esc(c.experiment_id)}<em>${c.seats.length}</em></button>`).join("");
  el.querySelectorAll(".filt").forEach(b => b.onclick = () => pickExperiment(b.dataset.c));
}

function pickExperiment(id) {
  if (id === S.experiment) return;
  S.experiment = id;
  S.msgs = []; S.tips = []; S.msgn = 0; S.pair = null;
  S.tree = {}; S.treeRound = {}; S.inspect = {}; S.body = {}; S.mailboxQuery = "";
  S.agent = null; S.detail = null; S.episode = null; S.view = null; S.drawn = 0;
  blank(document.getElementById("body"), `<div class="empty">loading&hellip;</div>`);
  renderPicks();
  refresh();
}

function tileHtml(s, i) {
  const balance = s.live_balance != null ? s.live_balance : s.balance;
  const left = s.budget ? Math.max(0, Math.min(1, balance / s.budget)) : 0;
  const g = s.transfer;
  const taken = Object.entries(s.penalised || {}).filter(([, v]) => v);
  // A submitted declaration that moved nothing carries settlement's reason here.
  const transfer = g && g.submitted && !g.amount
    ? `<span class="tag warn" title="${esc(g.error || "")}">transfer declared, moved nothing</span>`
    : g && g.amount ? `<span class="tag">transfer ${num(g.amount)} → ${esc(g.label || g.seat)}</span>` : "";
  const pinned = [s.model ? `<span class="tag" title="provider and model">${esc(`${s.provider || ""}/${s.model}`.replace(/^\//, ""))}</span>` : "",
    s.starter_files ? `<span class="tag starter" title="${esc(s.starter_files)}">starter · ${esc(shortPath(s.starter_files))}</span>` : ""].filter(Boolean).join("");
  const state = s.pending_human
      ? `<span class="tag warn"><i class="dot"></i>waiting for a human</span>`
    : running(s)
      ? `<span class="tag live"><i class="dot"></i>ep${s.running_episode} · ${s.live_turns}t · derived</span>`
    : s.running_episode != null
      ? `<span class="tag warn" title="no trace was ever written for it">ep${s.running_episode} unfinished · ${ago(s.live_age)}</span>`
    : s.eliminated
      ? `<span class="tag bad" title="${esc(s.eliminated.reason)}">eliminated · r${s.eliminated.round}</span>`
    : s.exhausted
      ? `<span class="tag bad" title="${esc(s.out_reason)}">exhausted</span>`
    : s.out_reason
      ? `<span class="tag bad" title="${esc(s.out_reason)}">unseated</span>`
    : s.stopped_by_run
      ? `<span class="tag bad" title="its last episode ended on ${esc(s.stop)}, after which the run starts no further episode on it">unseated</span>`
    : s.preparing
      ? `<span class="tag warn"><i class="dot"></i>preparing first round</span>`
    : s.pending
      ? `<span class="tag" title="the round is still going and this seat has not acted yet">not yet this round</span>`
    : s.behind
      ? `<span class="tag bad" title="more than a round behind, so the run seats it in no further round">unseated</span>`
      : `<span>ep${s.committed} committed</span>`;
  const idle = s.eliminated || s.exhausted || s.unseated;
  return `<div class="tile ${idle ? "idle" : ""}">
    <div class="k"><span style="color:${inkOf(i)}">${s.seat == null ? "agent" : esc(nameOf(s.seat))}</span>
      <b>${esc(s.agent)}</b></div>
    <div class="v ${balance < 0 ? "neg" : ""}">${num(balance)}</div>
    <div class="bar ${balance < 0 ? "over" : ""}"><i style="width:${(left * 100).toFixed(1)}%"></i></div>
    ${pinned ? `<div class="pinned">${pinned}</div>` : ""}
    <div class="m">${state}<i>|</i>
      <span title="spent this round">round ${num(s.spent_this_round)}</span>
      <span title="spent in all, summed from its episodes; the bar above is how
        far the balance itself has fallen, which transfers and shares also move"
        >of ${num(s.spent)}</span>
      ${(s.silent || []).map(u => `<span class="tag bad" title="silent on ${esc(u.channel)}">${
        esc(u.channel)}: ${esc(u.why)}</span>`).join(" ")}
      ${(s.sent || s.received || s.rebated || taken.length || s.floored || transfer) ? `<i>|</i>
        ${s.sent ? `<span title="given away">→ ${num(s.sent)}</span>` : ""}
        ${s.received ? `<span title="given to it">← ${num(s.received)}</span>` : ""}
        ${s.rebated ? `<span title="won back for what it gave">↺ ${num(s.rebated)}</span>` : ""}
        ${taken.map(([name, n]) => `<span title="taken for silence on ${esc(name)}">− ${num(n)} ${esc(name)}</span>`).join(" ")}
        ${s.floored ? `<span title="floored back to zero; its environment never says so"
          >floored ${num(s.floored)}</span>` : ""}${transfer}` : ""}
      ${(s.stopped_by_run || s.drift.length) ? `<i>|</i>
        ${s.stopped_by_run ? `<span class="tag bad">${esc(s.stop)}</span>` : ""}
        ${s.drift.length ? `<span class="tag warn" title="${esc(s.drift.join("; "))}">drift</span>` : ""}` : ""}</div>
  </div>`;
}

function renderFold() {

function electionHtml(h) {
  if (!h.every) return "";
  const latest = (h.elections || [])[h.elections.length - 1];
  const next = h.round && h.round % h.every === 0
    ? h.round : (Math.floor((h.round || 0) / h.every) + 1) * h.every;
  if (!latest) return `<div class="election"><div class="kv"><div class="k">election</div></div>
    <div class="result">vote every ${h.every} rounds · ${h.round_type === "vote"
      ? `voting now` : `next vote r${next}`}</div></div>`;
  const tally = Object.entries(latest.tally || {}).map(([label, votes]) =>
    `<span class="tag">${esc(label)} · ${num(votes)}</span>`).join("");
  let outcome = latest.voted_out
    ? `${esc(latest.voted_out)} eliminated with ${num(latest.top_votes)} votes`
    : latest.tied ? `top vote tied at ${num(latest.top_votes)}; nobody eliminated by vote`
    : `nobody eliminated by vote`;
  if ((latest.abstainers || []).length) outcome += ` · abstainers: ${latest.abstainers.map(esc).join(", ")}`;
  if ((latest.interrupted || []).length) outcome += ` · interrupted before voting: ${latest.interrupted.map(esc).join(", ")}`;
  return `<div class="election"><div class="kv"><div class="k">round ${latest.round} election · aggregate</div></div>
    <div class="tally">${tally}</div><div class="result">${outcome}</div>
    <div class="note">candidates left: ${(latest.candidates_left || []).map(esc).join(", ") || "none"}</div></div>`;
}

    (h.seated ? "" : ` · no seating: these agents have no board or mailbox between them`);

    || (s.running_episode != null && !running(s))).length;
  const pct = budget ? `${Math.max(0, balance / budget * 100).toFixed(0)}% of budget` : "current balance";
  document.getElementById("metrics").innerHTML = [

    ["spent this round", num(roundSpent), `round ${h.round}`, ""],
    ["spent total", num(totalSpent), h.cost && h.cost.maximum != null
      ? `${num(autonomousSpent)} autonomous · ${num(h.cost.maximum)} ceiling`
      : `${num(autonomousSpent)} autonomous`, h.cost && h.cost.warning_reached ? "attn" : ""],
    ["active now", `${h.active}/${h.seat_tiles.length}`, live ? `${live} episode${live === 1 ? "" : "s"} live` : "no episode live", ""],
    ["needs attention", num(attention), attention ? "unfinished, silent, unseated, or drifted" : "no current alerts", attention ? "attn" : ""]
  ].map(([k, v, s, cls]) => `<div class="metric ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`).join("");
  document.getElementById("seats").innerHTML = h.seat_tiles.map(tileHtml).join("");
  // The ledger reads the same three bare numbers for everyone, including the
  // agent a transfer was aimed at. The gloss is the page's.
  const rows = h.ledger.map(([giver, receiver, amount]) => `<tr>
      <td class="num">${esc(giver)} ${esc(receiver)} ${num(amount)}</td>
      <td class="note">${esc(seatName(giver) || "")} → ${esc(seatName(receiver) || "")}</td></tr>`).join("");
  const latest = h.progress && h.progress.latest;
  const terminal = latest && ["completed", "interrupted", "cost_ceiling"].includes(latest.stage);
  const result = terminal ? h.outcome : null;
  const lineage = h.lineage;
  const productState = result
    ? `<div class="product-state"><div class="kv"><div class="k">outcome · ${esc(result.end_reason)}</div></div>
       <div class="result">${result.winners && result.winners.length ? `winner${result.winners.length === 1 ? "" : "s"}: ${result.winners.map(esc).join(", ")}`
         : `survivors: ${(result.survivors || []).map(esc).join(", ") || "none"}`}</div></div>`
    : latest ? `<div class="product-state"><div class="kv"><div class="k">${esc((latest.stage || "").replaceAll("_", " "))}</div></div>
       <div class="result">round ${num(latest.round)}${lineage ? ` · branch of ${esc(lineage.source_experiment_id)} at round ${num(lineage.source_round)}` : ""}</div></div>` : "";
  redraw(document.getElementById("gwrap"), !h.seated ? "" : `<div class="gbox">
