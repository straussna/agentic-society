           : `<div class="note" style="margin-top:8px">no transfer has moved</div>`}</div>` : ""}
    <div class="chart-block">${overlay(h.seat_tiles)}</div></div>`);
  const tabs = h.tabs || [];
  if (!tabs.some(t => t.key === S.tab)) S.tab = (tabs[0] || {}).key;
  document.getElementById("tabs").innerHTML = tabs.map(({key, label}) => {
    const off = key === "mailbox" && (!h.posts || h.seat_tiles.length < 2);
    return `<button class="tab ${S.tab === key ? "on" : ""}" role="tab" aria-selected="${S.tab === key}"
      data-t="${key}">${esc(label)}${
      key === "mailbox" && S.msgn ? `<em>${S.msgn}</em>` : ""}${off ? `<em>–</em>` : ""}</button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    if (b.dataset.t === S.tab) return;
    S.tab = b.dataset.t;
    renderHeader();
    blank(document.getElementById("body"), `<div class="empty">loading&hellip;</div>`);
    renderTab();
  });
}

// --- mailbox and schema activity ----------------------------------------

// A thread is the pair of seats a channel runs between: outbox/1 written by seat 0
// and outbox/0 written by seat 1 are the two directions of one conversation, so
// events are keyed on the pair, not on the sender.
const pairKey = (a, b) => [a, b].sort((x, y) => Number(x) - Number(y)).join("·");

const seatInk = (seat) => {
  const i = seatTiles().findIndex(s => String(s.seat) === String(seat));
  return i < 0 ? "var(--ink)" : inkOf(i);
};

const seatTag = (seat) => `<b style="color:${seatInk(seat)}">${esc(nameOf(seat))}</b>`;

// Every pair of the experiment, whether or not anything has passed between them: two
// agents that have never addressed each other are a fact about the round, and a
// thread that only appeared once it had traffic could not be looked for.
function threadsOf() {
  const seated = seatTiles().filter(s => s.seat != null);
  const by = new Map();
  for (let i = 0; i < seated.length; i++) {
    for (let j = i + 1; j < seated.length; j++) {
      by.set(pairKey(seated[i].seat, seated[j].seat),
             { key: pairKey(seated[i].seat, seated[j].seat), a: seated[i], b: seated[j],
               events: [], tips: [] });
    }
  }
  // A path naming what is not a seat of this experiment reaches nobody, and so does
  // a declaration that resolved to no one. Neither sits between two agents, and
  // both are still something a sender wrote.
  const loose = { key: "∅", a: null, b: null, events: [], tips: [] };
  const bin = (e) => (e.to_agent == null ? null : by.get(pairKey(e.from_seat, e.to_seat))) || loose;
  for (const e of S.msgs) bin(e).events.push(e);
  for (const e of S.tips) bin(e).tips.push(e);
  const out = [...by.values()];
  if (loose.events.length || loose.tips.length) out.push(loose);
  return out;
}

// Old traces may contain standing-message events. They are hidden by default.
const saidIn = (t) => t.events.filter(e => S.standing || e.change !== "standing");

function previewOf(t) {
  const all = saidIn(t).concat(t.tips);
  const e = all[all.length - 1];
  if (!e) return "nothing addressed";
  if (e.event_type === "transfer") return `transfer · ${(e.transfer || {}).amount
    ? num(e.transfer.amount) : "moved nothing"}`;
  if (e.change === "withdrawn") return `${nameOf(e.from_seat)} took back ${e.path}`;
  return `${nameOf(e.from_seat)}: ${(e.text || "").trim().split("\n")[0] || "(empty)"}`;
}

function conversationText(t) {
  return [t.a && t.a.seat, t.a && t.a.agent, t.b && t.b.seat, t.b && t.b.agent,
          previewOf(t)].filter(Boolean).join(" ").toLowerCase();
}

function latestOf(t) {
  const all = saidIn(t).concat(t.tips);
  const e = all[all.length - 1] || {};
  return [Number(e.round || 0), String(e.at || ""), all.length];
}

const whenOf = (e) => e.tip ? "not traced yet" : `round ${e.round}`;

// What the addressee started holding. m is the authority wherever the
// observation carried one: the inbox arrives in it, so an episode that named no
// command about the inbox has the message all the same. Where none was carried
// there is only what stood in the environment for that episode to go and fetch.
// Naming the inbox in a command is a second thing either way - a turn spent on
// a read, beside a delivery that cost nothing.
function gotHtml(d, from) {
  const box = esc(d.shown_as || d.box || `inbox/${from}`);
  const again = d.named ? ` · <span class="tag">read ${box}${
    d.shown_before === true ? " again" : ""}</span>` : "";
  if (d.shown_before === true) {
    return `<span style="color:var(--live)">in its observation</span>${again}`;
  }
  if (d.shown_before === false) {
    return d.environment
      ? `<span style="color:var(--warn)" title="${d.clipped ? "the initial observation ran past its limit, and what clip takes is the middle" : "it stood in the environment and the initial observation did not carry it"}">in its environment, not in its observation</span>${again}`
      : `never reached it${again}`;
  }
  return (d.environment ? `in its environment · <span title="the initial observation was the listing alone, so the inbox was there to be fetched">nothing was carried</span>`
                  : `never reached it`) + again;
}

function msgHtml(e, t) {
  const g = e.transfer || {};
  if (e.event_type === "transfer") {
    const moved = g.amount ? `moved ${num(g.amount)} to ${esc(nameOf(g.seat || e.to_seat))}`
      : `<span style="color:var(--warn)" title="${esc(g.error || "")}">moved nothing</span>`;
    return `<div class="sys">${seatTag(e.from_seat)} ${e.change === "withdrawn"
      ? "withdrew its transfer declaration" : `declared a transfer · ${moved}`}
      · ${whenOf(e)}</div>`;
  }
  if (e.change === "withdrawn") {
    return `<div class="sys">${seatTag(e.from_seat)} took back ${esc(e.path)}, and nothing
      stands there now · ${whenOf(e)}</div>`;
  }
  const tag = e.change === "edited"
      ? `<span class="tag edit">edited</span>`
    : e.change === "standing"
      ? `<span class="tag" title="recorded by an older standing-message trace">stood</span>` : "";
  const diff = e.diff.length ? `<details><summary>what changed</summary><pre class="diff">${
    e.diff.map(diffLine).join("\n")}</pre></details>` : "";
  const body = e.binary ? `<pre class="note">not text</pre>`
    : e.text ? `<pre>${esc(e.text)}</pre>` : `<pre class="note">empty</pre>`;
  const ft = e.delivered
    ? `→ ${esc(e.to_agent)} ep${e.delivered.episode} (round ${
        e.delivered.round}) · ${gotHtml(e.delivered, e.from_seat)}`
    : e.tip ? "standing now; no episode has started since"
    : "not delivered yet";
  const side = !t.a || String(e.from_seat) === String(t.a.seat) ? "" : "r";
  const tip = e.tip ? "tip" : "";
  const same = e.change === "standing" ? "same" : "";
  return `<div class="msg ${side} ${tip} ${same}">
    <div class="mh">${seatTag(e.from_seat)}
      <span>${esc(e.from_agent)} ep${e.episode == null ? "?" : e.episode}</span>
      <span class="num">${esc(e.path)}${e.size ? ` · ${num(e.size)} B` : ""}</span>${tag}</div>
    <div class="bub">${body}${diff}</div>
    <div class="ft">${ft}</div></div>`;
}

function threadHtml(t) {
  let out = "", seen = null;
  for (const e of saidIn(t)) {
    if (e.round !== seen) { seen = e.round; out += `<div class="round">round ${e.round}<i></i></div>`; }
    out += msgHtml(e, t);
  }
  if (!out) {
    out = `<div class="empty">${t.a ? `${esc(nameOf(t.a.seat))} and ${esc(nameOf(t.b.seat))} have addressed
      nothing to each other` : "nothing has reached nobody"}</div>`;
  }
  if (t.tips.length) {
    out += `<div class="round">ahead of the last trace<i></i></div>`
         + t.tips.map(e => msgHtml(e, t)).join("");
  }
  return out;
}

function renderMessages() {
  const el = document.getElementById("body"), h = S.head;
  if (h && h.seat_tiles.length < 2) {
    blank(el, `<div class="empty">an experiment of one: there is nobody to address</div>`);
    return;
  }
  if (h && !h.posts) {
    blank(el, `<div class="empty">no outbox in this experiment's environment</div>`);
    return;
  }
  const all = threadsOf();
  if (!all.length) { blank(el, `<div class="empty">no seats to address</div>`); return; }
  const query = S.mailboxQuery.trim().toLowerCase();
  const ts = all.filter(t => (S.showEmpty || saidIn(t).length || t.tips.length)
      && (!query || conversationText(t).includes(query))).sort((a, b) => {
    const aa = latestOf(a), bb = latestOf(b);
    return bb[0] - aa[0] || bb[1].localeCompare(aa[1]) || bb[2] - aa[2]
      || a.key.localeCompare(b.key, undefined, {numeric:true});
  });
  if (!ts.length) {
    const controls = `<div class="pair-tools"><label class="note" for="pair-search">Find a conversation</label>
      <div class="search-wrap"><input class="search" id="pair-search" type="search" value="${esc(S.mailboxQuery)}"
        placeholder="Agent, seat, or message text"><button class="search-clear" id="clear-pair-search"
        aria-label="Clear conversation search" title="Clear search">×</button></div>
      <div class="pair-options"><label class="tail"><input type="checkbox" id="empty-pairs"
        ${S.showEmpty ? "checked" : ""}>show empty pairs</label><span>0 shown</span></div></div>`;
    redraw(el, `<div class="fill"><div class="chat" style="--split:${S.mailboxWidth}px"><div class="pairs">${controls}</div>
      <div class="splitter" data-resize="mailbox" role="separator" aria-label="Resize conversation list" aria-orientation="vertical" tabindex="0"></div>
      <div class="thread"><div class="empty">no conversations match</div></div></div></div>`);
    wireConversationFilters(el);
    return;
  }
  // The busiest thread, so a page opened on an experiment mid-round lands on one
  // that has something in it and not on whichever pair sorts first.
  if (!ts.some(t => t.key === S.pair)) {
    S.pair = ts.reduce((a, b) => saidIn(b).length > saidIn(a).length ? b : a).key;
  }
  const t = ts.find(x => x.key === S.pair);
  const sig = JSON.stringify([S.pair, S.standing, S.rail, S.mailboxQuery, S.showEmpty,
    ts.map(x => [x.key, x.events.length]),
    S.tips.map(e => [e.from_seat, e.path, e.change, e.size])]);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const side = ts.map(x => {
    const n = saidIn(x).length + x.tips.length;
    return `<button class="pair ${x.key === S.pair ? "on" : ""} ${n ? "" : "mute"}"
        data-k="${esc(x.key)}" aria-pressed="${x.key === S.pair}"><div class="t"><span class="nm">${
        x.a ? `${seatTag(x.a.seat)} ⇄ ${seatTag(x.b.seat)}` : "addressed to nobody"}</span>
        <em>${n || "–"}</em></div>
      <div class="p">${esc(previewOf(x))}</div></button>`;
  }).join("");
  // The toggle is the experiment's, not this thread's, so it is counted over the
  // whole log: switching threads must not move the number it offers.
  const same = S.msgs.filter(e => e.change === "standing").length;
  const controls = `<div class="pair-tools"><label class="note" for="pair-search">Find a conversation</label>
    <div class="search-wrap"><input class="search" id="pair-search" type="search" value="${esc(S.mailboxQuery)}"
      placeholder="Agent, seat, or message text"><button class="search-clear" id="clear-pair-search"
      aria-label="Clear conversation search" title="Clear search">×</button></div>
    <div class="pair-options"><label class="tail"><input type="checkbox" id="empty-pairs"
      ${S.showEmpty ? "checked" : ""}>show empty pairs</label><span>${ts.length} of ${all.length}</span></div></div>`;
  const head = `<div class="thead">
    <button class="icon-btn" id="rail" aria-label="${S.rail ? "Show" : "Collapse"} conversation list"
      aria-expanded="${!S.rail}" title="${S.rail ? "Show" : "Collapse"} conversation list">${S.rail ? "›" : "‹"}</button>
    <span class="nm">${
    t.a ? `${seatTag(t.a.seat)} ⇄ ${seatTag(t.b.seat)}` : "addressed to nobody"}</span>
    <span class="note">${t.a ? `${esc(t.a.agent)} · ${esc(t.b.agent)}`
      : "a name that is no seat of this experiment"}</span>
    ${same ? `<label class="tail" style="margin-left:auto"><input type="checkbox" id="stand"
      ${S.standing ? "checked" : ""}>show ${same} legacy standing event${same === 1 ? "" : "s"}</label>` : ""}
    </div>`;
  redraw(el, `<div class="fill"><div class="note" style="margin:2px 0 8px">Activity · newest conversations first</div>
    <div class="chat ${S.rail ? "narrow" : ""}" style="--split:${S.mailboxWidth}px"><div class="pairs">${controls}${side}</div>
      <div class="splitter" data-resize="mailbox" role="separator" aria-label="Resize conversation list" aria-orientation="vertical" tabindex="0"></div>
      <div class="thread">${head}<div id="thread">${threadHtml(t)}</div></div></div></div>`);
  el.querySelectorAll(".pair").forEach(b => b.onclick = () => {
    if (b.dataset.k === S.pair) return;
    S.pair = b.dataset.k; el.dataset.sig = ""; renderMessages();
    // A thread is opened at its first round, not at wherever the last one was
    // being read: the offset held across the redraw belongs to the other thread.
    const now = document.getElementById("thread");
    if (now) now.scrollTop = 0;
  });
  const stand = document.getElementById("stand");
  if (stand) stand.onchange = e => { S.standing = e.target.checked; el.dataset.sig = ""; renderMessages(); };
  wireConversationFilters(el);
  document.getElementById("rail").onclick = () => {
    S.rail = !S.rail; hold("rail", S.rail); el.dataset.sig = ""; renderMessages();
  };
}

function wireConversationFilters(el) {
  const search = document.getElementById("pair-search");
  const update = e => {
    S.mailboxQuery = e.target.value;
    clearTimeout(S.mailboxTimer);
    S.mailboxTimer = setTimeout(() => {
      el.dataset.sig = ""; renderMessages();
      const next = document.getElementById("pair-search");
      if (next) { next.focus(); next.setSelectionRange(next.value.length, next.value.length); }
    }, 120);
  };
  if (search) { search.oninput = update; search.onsearch = update; search.onchange = update; }
  const clear = document.getElementById("clear-pair-search");
  if (clear) clear.onclick = () => {
    clearTimeout(S.mailboxTimer); S.mailboxQuery = ""; el.dataset.sig = ""; renderMessages();
    const next = document.getElementById("pair-search");
    if (next) next.focus();
  };
  const empty = document.getElementById("empty-pairs");
  if (empty) empty.onchange = e => {
    S.showEmpty = e.target.checked; hold("show-empty-pairs", S.showEmpty);
    el.dataset.sig = ""; renderMessages();
  };
}

// --- directory channels -------------------------------------------------------

function keyOf(channel, agent) {
  const round = S.treeRound[channel];
  return channel + ":" + (round == null ? "live" : "r" + round) + ":" + agent;
}

function snapshotHtml(d) {
  if (!d.history) return "";
  const isBoard = d.history.kind === "round";
  return `<div class="snapshotbar"><span class="lbl">${isBoard ? "Posts" : "Votes"}</span>
    <div class="snapshots" role="group" aria-label="${isBoard ? "Board round snapshots" : "Ballot vote-round snapshots"}">
      <button class="chip ${d.history.selected == null ? "on live" : ""}" data-round="" aria-pressed="${d.history.selected == null}">Live</button>
      ${d.history.rounds.map(r => `<button class="chip ${d.history.selected === r ? "on" : ""}"
        data-round="${r}" aria-pressed="${d.history.selected === r}">${isBoard ? "" : "vote "}r${r}</button>`).join("")}
    </div></div>`;
}

function wireSnapshots(el, channel) {
  el.querySelectorAll(".snapshots [data-round]").forEach(button => button.onclick = () => {
    const selected = button.dataset.round === "" ? null : Number(button.dataset.round);
    if ((S.treeRound[channel] == null ? null : S.treeRound[channel]) === selected) return;
    S.treeRound[channel] = selected;
    S.inspect[channel] = null;
    blank(el, `<div class="empty">loading ${selected == null ? "live chat" : `round ${selected}`}&hellip;</div>`);
    renderTab();
  });
}

function renderBoard(channel) {
  const d = S.tree[channel], el = document.getElementById("body");
  if (!d) return;
  const selected = d.history.selected;
  const messages = [];
  for (const [i, c] of d.columns.entries()) {
    for (const f of c.files) {
      const got = S.body[keyOf(channel, c.agent) + ":" + f.path];
      messages.push({c, f, got, color:inkOf(i)});
    }
  }
  const sig = JSON.stringify([channel, d.history, messages.map(m =>
    [m.c.agent, m.c.committed, m.f.path, m.f.stamp, m.got && m.got.stamp])]);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const roundName = selected == null ? "Live board" : `Round ${selected} board`;
  const posters = messages.map(m => `<span class="poster" style="color:${m.color}"
    title="${esc(m.c.agent)}">${esc(m.c.seat == null ? m.c.agent.slice(0,2) : m.c.seat)}</span>`).join("");
  const posts = messages.map(({c, f, got, color}) => {
    const body = got === undefined ? `<pre class="note">Reading&hellip;</pre>`
      : got == null ? `<pre class="note">This post is no longer available.</pre>`
      : got.text == null ? `<pre class="note">Binary post · ${num(got.size)} B</pre>`
      : got.text ? `<pre>${esc(got.text)}</pre>` : `<pre class="note">empty post</pre>`;
    return `<article class="msg" style="--speaker:${color}"><div class="mh">${seatTag(c.seat)}
      <b>${esc(c.agent)}</b><span>${selected == null ? `as of ep${c.committed}` : `ep${c.committed}`}</span>
      ${c.files.length > 1 ? `<span>${esc(f.path)}</span>` : ""}</div><div class="bub">${body}</div></article>`;
  }).join("");
  const missing = d.columns.filter(c => !c.files.length).map(c => nameOf(c.seat)).filter(Boolean);
  const status = messages.length ? `${messages.length} post${messages.length === 1 ? "" : "s"} · ${
    new Set(messages.map(m => m.c.agent)).size} seat${new Set(messages.map(m => m.c.agent)).size === 1 ? "" : "s"}` : "no posts";
  redraw(el, `<div class="fill">${snapshotHtml(d)}<section class="thread board-view" aria-label="${esc(roundName)}">
    <div class="thead"><div class="group-title"><span class="nm">${esc(roundName)}</span><span class="note">${status}</span></div>
      <div class="posters" aria-label="Seats that posted">${posters}</div></div>
    <div id="thread" role="log" aria-label="Posts in ${esc(roundName)}">${posts || `<div class="empty">Nothing was posted on this board.</div>`}
      ${missing.length && selected != null ? `<div class="sys">No post from ${missing.map(esc).join(", ")}</div>` : ""}</div>
    </section></div>`);
  wireSnapshots(el, channel);
}

function renderBallotAggregate(channel) {
  const d = S.tree[channel], el = document.getElementById("body");
  if (!d) return;
  const selected = d.history.selected;
  const ballots = [], missing = [];
  for (const [i, c] of d.columns.entries()) {
    if (!c.files.length) { missing.push(c); continue; }
    for (const f of c.files) {
      const got = S.body[keyOf(channel, c.agent) + ":" + f.path];
      const target = got && got.text != null ? got.text.trim() : null;
      ballots.push({c, f, got, target, color:inkOf(i)});
    }
  }
  const sig = JSON.stringify([channel, d.history, d.vote_round, d.election, ballots.map(b =>
    [b.c.agent, b.c.committed, b.f.stamp, b.got && b.got.stamp, b.target])]);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  // The tally is the election's, as the accounts store it, and not a count of the
  // files below: a ballot naming no candidate, or the voter itself, counts for nobody.
  const ranked = Object.entries((d.election || {}).tally || {}).sort((a, b) => b[1] - a[1]
    || a[0].localeCompare(b[0], undefined, {numeric:true}));
  const high = Math.max(1, ...ranked.map(([, count]) => count));
  const results = ranked.map(([label, count]) => `<div class="vote-result">
    <span class="target">${esc(labelName(label))}</span><span class="vote-bar"><i style="width:${count / high * 100}%"></i></span>
    <span class="count">${count} vote${count === 1 ? "" : "s"}</span></div>`).join("");
  const untallied = selected != null ? `No election after round ${selected} is on record.`
    : d.vote_round ? "Not tallied yet: the election is held once every elector has taken the round."
    : "This round is a discussion round: no election follows it.";
  const rows = ballots.map(({c, got, target}) => `<tr><td>${seatTag(c.seat)} · ${esc(c.agent)}</td>
    <td>${got === undefined ? "reading…" : got == null ? "unavailable" : got.text == null ? "binary ballot"
      : target ? `→ ${esc(labelName(target))}` : "empty ballot"}</td></tr>`).join("");
  const roundName = selected == null ? "Live ballot" : `Round ${selected} ballot`;
  const summary = `${ballots.length} submitted · ${missing.length} seat${missing.length === 1 ? "" : "s"} did not act in this round`;
  redraw(el, `<div class="fill">${snapshotHtml(d)}<section class="thread ballot-view" aria-label="${esc(roundName)} aggregate">
    <div class="thead"><div class="group-title"><span class="nm">${esc(roundName)}</span>
      <span class="note">${summary}</span></div></div><div class="ballot-body">
      <div class="vote-tally">${!d.election ? `<div class="empty">${untallied}</div>`
        : results || `<div class="empty">No candidates in this election.</div>`}</div>
      ${rows ? `<div class="round">submitted ballots<i></i></div><table class="ballot-table"><tbody>${rows}</tbody></table>` : ""}
    </div></section></div>`);
  wireSnapshots(el, channel);
}

function renderTree(channel) {
  const d = S.tree[channel], el = document.getElementById("body");
  if (!d) return;
  if (d.history && d.history.kind === "round") return renderBoard(channel);
  if (d.history && d.history.kind === "vote") return renderBallotAggregate(channel);
  const chosen = S.inspect[channel] || null;
  const sig = JSON.stringify([channel, d.history, d.columns.map(c =>
    [c.agent, c.committed, c.running_episode, c.files.map(f => [f.path, f.stamp, f.mode])]),
    chosen, Object.entries(S.body).map(([k, v]) => [k, v && v.stamp])]);
  if (el.dataset.sig === sig) return;
  el.dataset.sig = sig;
  const what = d.what || "";
  const historical = d.history && d.history.selected != null;
  const stamp = (c) => {
    if (d.static) return `the manifest's source`;
    if (historical && c.committed == null) return `did not act in round ${d.history.selected}`;
    if (historical && c.saved) return `end of round ${d.history.selected} · ep${c.committed}`;
    if (historical) return `ep${c.committed} · state was not saved`;
    const seat = c.seat == null ? "" : `${esc(c.agent)} · `;
    const live = c.running_episode == null ? "" : running(c) ? " · an episode is running" : " · an episode never finished";
    return `${seat}as of ep${c.committed}${live}`;
  };
  const snapshots = snapshotHtml(d);
  const index = d.columns.map(c => {
    const rows = c.files.map(f => {
      const on = chosen && chosen.agent === c.agent && chosen.path === f.path;
      return `<button class="file-row ${on ? "on" : ""}" data-agent="${esc(c.agent)}"
        data-p="${esc(f.path)}" aria-pressed="${!!on}">
        <span class="path">${esc(f.path)}</span><span class="meta">${num(f.size)} B${f.mode ? ` · ${esc(f.mode)}` : ""}</span>
        <span>${f.starter ? `<span class="tag starter">starter</span>` : ""}</span></button>`;
    }).join("");
    return `<div class="col"><div class="h">
        <b>${c.seat == null ? esc(c.agent) : esc(c.seat) + "/"}</b>
        <span>${stamp(c)}</span></div>
      <div class="file-list">${rows ? rows
        : `<div class="note" style="padding:10px 0">empty</div>`}</div></div>`;
  }).join("");
  const selectedColumn = chosen && d.columns.find(c => c.agent === chosen.agent);
  const got = chosen ? S.body[keyOf(channel, chosen.agent) + ":" + chosen.path] : undefined;
  const inspector = !chosen ? `<aside class="inspector empty-inspector" aria-label="File inspector">
      Select a file to inspect it here.</aside>`
    : `<aside class="inspector" aria-label="File inspector"><div class="inspector-head">
        <div class="inspector-title"><b>${esc(chosen.path)}</b><span>${selectedColumn ? stamp(selectedColumn) : esc(chosen.agent)}</span></div>
        <button class="icon-btn" id="close-inspector" aria-label="Close file inspector" title="Close file inspector">×</button></div>
      <div class="inspector-body">${got === undefined ? `<div class="note">Reading&hellip;</div>`
        : got == null ? `<div class="note">This file is no longer available.</div>`
        : got.text == null ? `<div class="note">Binary file · ${num(got.size)} B</div>`
        : `<pre class="file-content">${esc(got.text)}</pre>`}</div></aside>`;
  redraw(el, `<div class="fill">${snapshots}<div class="note" style="margin:2px 0 8px">${what}${d.static ? ""
      : historical ? ` · immutable state captured from each seat's committed episode in round ${d.history.selected}`
      : ` · mirrored back when an episode ends, so each column is as of that agent's own last
      committed one`}</div>
    <div class="treeview" ${S.treeWidth == null ? "" : `style="--split:${S.treeWidth}px"`}><div class="treeindex"><div class="cols">${index}</div></div>
      <div class="splitter" data-resize="tree" role="separator" aria-label="Resize file list" aria-orientation="vertical" tabindex="0"></div>${inspector}</div></div>`);
  el.querySelectorAll(".file-row").forEach(row => row.onclick = () => {
    const same = chosen && chosen.agent === row.dataset.agent && chosen.path === row.dataset.p;
    S.inspect[channel] = same ? null : {agent:row.dataset.agent, path:row.dataset.p};
    el.dataset.sig = "";
    pullFiles(channel).then(() => renderTree(channel));
  });
  const close = document.getElementById("close-inspector");
  if (close) close.onclick = () => closeInspector(channel);
  wireSnapshots(el, channel);
}

function closeInspector(channel) {
  S.inspect[channel] = null;
  const el = document.getElementById("body");
  el.dataset.sig = "";
  renderTree(channel);
}

// A file is read when it is opened, and again when its stamp moves. The listing
// carries the stamp, so a column of files nobody has opened costs nothing.
function pullFiles(channel) {
  const d = S.tree[channel];
  if (!d) return Promise.resolve();
  const chosen = S.inspect[channel];
  if (!chosen) return Promise.resolve();
  const c = d.columns.find(column => column.agent === chosen.agent);
  const key = keyOf(channel, chosen.agent) + ":" + chosen.path;
  const f = c && c.files.find(file => file.path === chosen.path);
  if (!f) { S.body[key] = null; return Promise.resolve(); }
  const cached = S.body[key];
  if (cached && JSON.stringify(cached.stamp) === JSON.stringify(f.stamp)) return Promise.resolve();
  let q = `agent=${encodeURIComponent(chosen.agent)}&channel=${encodeURIComponent(channel)}&path=${encodeURIComponent(chosen.path)}`;
  if (S.treeRound[channel] != null) q += `&round=${encodeURIComponent(S.treeRound[channel])}`;
  return get(`/api/experiment/${encodeURIComponent(S.experiment)}/file?${q}`)
    .then(value => { S.body[key] = value; }).catch(() => { S.body[key] = null; });
}

function pullChannelFiles(channel) {
  const d = S.tree[channel];
  if (!d) return Promise.resolve();
  const pulls = [];
  for (const c of d.columns) for (const f of c.files) {
    const key = keyOf(channel, c.agent) + ":" + f.path;
    const cached = S.body[key];
    if (cached && JSON.stringify(cached.stamp) === JSON.stringify(f.stamp)) continue;
    let q = `agent=${encodeURIComponent(c.agent)}&channel=${encodeURIComponent(channel)}&path=${encodeURIComponent(f.path)}`;
    if (S.treeRound[channel] != null) q += `&round=${encodeURIComponent(S.treeRound[channel])}`;
    pulls.push(get(`/api/experiment/${encodeURIComponent(S.experiment)}/file?${q}`)
      .then(value => { S.body[key] = value; }).catch(() => { S.body[key] = null; }));
  }
  return Promise.all(pulls);
}

// --- one agent's transcript ----------------------------------------------

// Forget the transcript on the page, so the next one opens at its start.
function resetTranscript(episode) {
  S.episode = episode; S.view = null; S.since = 0; S.source = null; S.tail = true;
  S.txtop = 0; S.txend = false;
}

function openAgent(agent) {
  if (S.agent !== agent) { S.agent = agent; resetTranscript(null); }
  return get(`/api/agent/${agent}`).then(d => {
    S.detail = d;
    if (S.episode == null) {
      S.episode = d.running_episode != null ? d.running_episode
        : (d.episodes.length ? d.episodes[d.episodes.length - 1].episode : null);
    }
    drawTranscript();
    return S.episode == null ? null : pullTurns(true);
  }).catch(() => {});
}

function openEpisode(n) {
  resetTranscript(n);
  drawTranscript();
  return pullTurns(true);
}

function pullTurns(reset) {
  if (S.agent == null || S.episode == null) return Promise.resolve();
  const agent = S.agent, episode = S.episode, since = reset ? 0 : S.since;
  return get(`/api/agent/${agent}/episode/${episode}?since=${since}`).then(d => {
    if (S.agent !== agent || S.episode !== episode) return;
    // The episode finished between polls: what was pending has landed, so it is
    // asked for again from the start instead of appended to.
    if (!reset && S.source === "raw" && d.source === "trace") return pullTurns(true);
    const fresh = reset || !S.view;
    if (fresh) { S.view = d; } else { S.view.turns = S.view.turns.concat(d.turns);
      Object.assign(S.view, { ...d, turns: S.view.turns }); }
    S.source = d.source;
    S.since = S.view.turns.reduce((m, t) => Math.max(m, t.turn || 0), 0);
    renderTranscript(fresh);
  }).catch(() => {});
}

function drawTranscript() {
  const d = S.detail, el = document.getElementById("body");
  if (!d) return;
  const chips = seatTiles().map(s =>
    `<button class="chip ${s.agent === S.agent ? "on" : ""} ${running(s) ? "live" : ""}"
       data-agent="${esc(s.agent)}" aria-pressed="${s.agent === S.agent}">${s.seat == null ? "" : esc(s.seat) + " · "}${esc(s.agent)}</button>`).join("");
  // A round the agent has no episode in is one it was already out of, and there
  // is nothing to open: the chip says so instead of disappearing and closing
  // the gap.
  const last = d.episodes.reduce((a, s) => Math.max(a, s.round || 0), 0);
  const byRound = {};
  d.episodes.forEach(s => { if (s.round) byRound[s.round] = s; });
  const rounds = Array.from({ length: last }, (_, i) => i + 1).map(r => {
    const s = byRound[r];
    if (!s) return `<button class="chip off" title="no episode of this agent's is on record for this round">r${r}</button>`;
    const classes = [s.episode === S.episode ? "on" : "", s.live && running(d) ? "live" : "",
      s.live && !running(d) ? "stopped" : "", s.stopped_by_run ? "stopped" : ""].filter(Boolean).join(" ");
    const state = esc(s.stop || (running(d) ? "running" : "unfinished"));
    return `<button class="chip ${classes}" data-s="${s.episode}" aria-pressed="${s.episode === S.episode}" title="ep${s.episode} · ${state} · ${s.turns} turns · spent ${num(s.spent)}">r${r}</button>`;
  }).join("");
  const here = d.episodes.find(s => s.episode === S.episode) || {};
  el.dataset.sig = "";
  // Provenance is config, and config is what an episode was. Drift is the
  // exception, so it is what stays on the page; the rest is put one click away
  // and not between the reader and the transcript. Every key the trace
  // holds is shown, in the order provenance() writes them, because drift
  // reports on all of them and a banner may not name a field the panel hides.
  const drifted = here.drift && here.drift.length;
  // "<key>: <was> -> <now>", so the key is what stands before the first colon.
  const moved = new Set((here.drift || []).map(s => s.split(":")[0]));
  el.innerHTML = `<div class="fill">
    <div class="strip" style="margin-bottom:6px"><span class="lbl">agent</span>${chips}</div>
    <div class="strip"><span class="lbl">round</span>${
      rounds || `<span class="note">none yet</span>`}</div>
    ${d.out_reason ? `<div class="note" style="margin-top:8px;color:var(--bad)">${esc(d.out_reason)}</div>` : ""}
    <div class="txbar" style="margin-top:10px">
      <div id="txhead" class="note"></div>
      <label class="tail"><input type="checkbox" id="tailbox" ${S.tail ? "checked" : ""}>follow</label>
    </div>
    <div class="txwrap"><div id="tx"><div class="empty">loading&hellip;</div></div>
      <button class="jump" id="jump" style="display:none">jump to latest ↓</button></div>
    ${drifted ? `<div class="note" style="margin-top:8px;color:var(--warn)"
      >configuration drift between episodes: ${esc(here.drift.join("; "))}</div>` : ""}
    <details style="margin-top:8px"><summary class="note" style="cursor:pointer"
      >provenance · episode ${S.episode}</summary>
      <div class="panel" style="margin-top:8px">${
      Object.keys(here.provenance || {}).length
        ? `<div class="grid">${Object.entries(here.provenance).map(([k, v]) =>
            `<div class="kv"><div class="k" ${moved.has(k)
              ? `style="color:var(--warn)"` : ""}>${esc(k.replace(/_/g, " "))}</div>
             <div class="v">${esc(provValue(v))}</div></div>`).join("")}</div>`
        : `<div class="note">no trace yet</div>`}</div>
    </details></div>`;
  el.querySelectorAll(".chip[data-agent]").forEach(b => b.onclick = () => openAgent(b.dataset.agent));
  el.querySelectorAll(".chip[data-s]").forEach(b => b.onclick = () => openEpisode(Number(b.dataset.s)));
  const tx = document.getElementById("tx"), toEnd = () => {
    tx.scrollTop = tx.scrollHeight;
    updateJump();
  };
  document.getElementById("tailbox").onchange = e => {
    S.tail = e.target.checked;
    if (S.tail) toEnd();
  };
  // The pane is thrown away and rebuilt whenever an episode starts or ends, so
  // where it is being read is recorded as it is scrolled and not read back
  // off a node that may no longer be there.
  tx.onscroll = () => { S.txtop = tx.scrollTop; S.txend = atEnd(tx); updateJump(); };
  document.getElementById("jump").onclick = toEnd;
  // The pane these counted is gone, rebuilt empty by the line above.
  S.drawn = 0;
  if (S.view) renderTranscript(true);
}

function turnHtml(t, pend) {
  const bits = [`turn ${t.turn}`, `${num(t.balance)} left`];
  if (t.micros) bits.push(`−${num(t.micros)}`);
  if (t.prefix) bits.push(`ctx ${num(t.prefix)}`);
  const tags = [
    t.stop_reason ? `<span class="tag">${esc(t.stop_reason)}</span>` : "",
    t.provider && t.model ? `<span class="tag">${esc(t.provider)}/${esc(t.model)}</span>` : "",
    t.refusal ? `<span class="tag bad">refused${t.refusal.refusal_type ? " · " + esc(t.refusal.refusal_type) : ""}</span>` : "",
  ].join(" ");
  const tools = (t.tools || []).map(c =>
    `<div class="cmd ${c.shell ? "shell" : "tool"}">${esc(c.call)}</div>` +
    (c.result == null ? `<div class="pend">⏳ ${pend}</div>`
                      : expandableHtml(c.result, "out", "tool output"))).join("");
  return `<div class="turn"><div class="th"><span class="num">${bits.join(" · ")}</span>${tags}</div>
    ${t.reasoning ? `<div class="think">${esc(t.reasoning)}</div>` : ""}
    ${t.text ? `<div class="say">${esc(t.text)}</div>` : ""}
    ${t.refusal && t.refusal.explanation ? `<div class="note">${esc(t.refusal.explanation)}</div>` : ""}
    ${tools}</div>`;
}

function updateJump() {
  const tx = document.getElementById("tx"), b = document.getElementById("jump");
  if (tx && b) b.style.display = behind(tx) > 60 ? "block" : "none";
}

// One block per tree the episode changed, because what matters about a change
// here is who can see it.
function diffHtml(changes) {
  return (changes || []).filter(c => c.lines.length).map(c =>
    `<div class="turn"><div class="th">${esc(c.what)}</div>${
      expandableHtml(c.lines.join("\n"), "out diff", "change")}</div>`).join("");
}

// The record the episode started holding, a file at a time. It reached the model as
// one command's stdout, but every section of it is a file some other agent wrote
// or the harness rendered, and a reader wants one of them, not the blob.
// The inboxes are open because they are what a round turns on; the rest is a
// click. An episode whose observation carried no record renders no block at all.
function carriedHtml(o) {
  if (!o.shown_before || !o.shown_before.length) return "";
  const bytes = o.shown_before.reduce((n, s) => n + s.bytes, 0);
  const files = o.shown_before.map(s =>
    `<details class="sec" ${o.inbox_prefix && s.path.startsWith(o.inbox_prefix) ? "open" : ""}>
       <summary>=== ${esc(s.path)} === <i>${num(s.bytes)} B</i></summary>
       ${expandableHtml(s.text, "out", "file")}</details>`).join("");
  return `<div class="turn"><div class="th">${esc(o.name)} · the record it started holding
    <span class="num">${o.shown_before.length} files · ${num(bytes)} B</span>${o.clipped
      ? `<span class="tag warn" title="the initial observation ran past its limit, and what clip
          takes is the middle">clipped</span>` : ""}</div>${files}</div>`;
}

// `fresh` rebuilds; without it only the turns that arrived since the last draw
// are appended, so the nodes the reader is scrolled in are the nodes that stay.
function renderTranscript(fresh) {
  const v = S.view, tx = document.getElementById("tx");
  if (!v || !tx) return;
  // Sent whole with the first turn of an episode and held from there, so an
  // append carries none of it and leaves what is on the page alone.
  const o = v.observation || {};
  const dead = v.live && v.age != null && v.age >= S.stale;
  // A command whose episode is over has no output coming: the trace that would
  // have carried it was never written.
  const pend = dead ? "no trace was written; this output is lost" : PENDING;
  const state = !v.live ? esc(v.stop)
    : dead ? `<b style="color:var(--warn)">unfinished</b> · last turn ${ago(v.age)} · derived cost`
           : "<b style='color:var(--live)'>running</b> · derived cost";
  const silent = (v.silent || []).map(u => ` · <span style="color:var(--bad)" title="${esc(u.channel)}">${esc(u.channel)}: ${esc(u.why)}</span>${charged(u.penalty)}`).join("");
  document.getElementById("txhead").innerHTML =
    `episode ${v.episode} · ${state} · ${v.total_turns} turns · spent ${num(v.spent)}` +
    silent +
    (v.floored ? ` · floored ${num(v.floored)}` : "") +
    (v.error ? ` · <span style="color:var(--bad)">${esc(v.error)}</span>` : "") +
    ((v.missing_tools || []).length ? ` · reached for and absent: ${esc(v.missing_tools.join(", "))}` : "");
  // Measured before anything is written, or the answer is about the page the
  // reader has not seen yet.
  const wasAtEnd = atEnd(tx);

  if (fresh) {
    redraw(tx,
      `<div class="turn"><div class="th">start · ${esc(nameOf(S.detail.seat))} at start ${
        v.balance_before.length ? num(v.balance_before[v.balance_before.length - 1]) : "–"}</div>
        <div class="cmd ${o.shell ? "shell" : "tool"}">${esc(o.command)}</div>` +
        (o.listing == null ? `<div class="pend">⏳ ${pend}</div>`
                           : expandableHtml(o.listing, "out", "listing")) + `</div>` +
      carriedHtml(o) +
      v.turns.map(t => turnHtml(t, pend)).join("") +
      diffHtml(v.changes));
    S.drawn = v.turns.length;
    // An episode opens where it starts and stays there. Only a reader who had
    // scrolled to the end, and is following, is carried to the new one - and
    // that is asked of the state, because the pane may be a new one that never
    // held the position it is being given back.
    tx.scrollTop = S.tail && S.txend ? tx.scrollHeight : S.txtop;
  } else {
    const extra = v.turns.slice(S.drawn);
    if (extra.length) {
      tx.insertAdjacentHTML("beforeend", extra.map(t => turnHtml(t, pend)).join(""));
      S.drawn = v.turns.length;
      // Follow only a reader who was already at the end. Anyone who has scrolled
      // up is reading, and the new turn waits behind the jump button.
      if (S.tail && wasAtEnd) tx.scrollTop = tx.scrollHeight;
    }
  }
  updateJump();
}

// --- the loop ------------------------------------------------------------

function renderTab() {
  if (S.tab === "mailbox") {
    return get(`/api/experiment/${encodeURIComponent(S.experiment)}/messages?since=${S.msgn}`).then(d => {
      S.msgs = S.msgs.concat(d.events); S.msgn = d.committed; S.tips = d.tip;
      renderMessages();
    }).catch(() => {});
  }
  if (S.tab !== "trace") {
    const selected = S.treeRound[S.tab];
    const query = selected == null ? "" : `?round=${encodeURIComponent(selected)}`;
    return get(`/api/experiment/${encodeURIComponent(S.experiment)}/tree/${encodeURIComponent(S.tab)}${query}`).then(d => {
      if (!Object.prototype.hasOwnProperty.call(S.treeRound, S.tab)
          && d.history && d.history.rounds.length) {
        S.treeRound[S.tab] = d.history.rounds[d.history.rounds.length - 1];
        return renderTab();
      }
      S.tree[S.tab] = d;
      const pull = d.history ? pullChannelFiles : pullFiles;
      return pull(S.tab).then(() => renderTree(S.tab));
    }).catch(() => {});
  }
  const at = seatTiles();
  if (!at.length) return Promise.resolve();
  if (S.agent == null || !at.some(s => s.agent === S.agent)) {
    return openAgent(((at.find(running) || at[0]) || {}).agent);
  }
  // An episode started or ended since the last poll: the round chips and the
  // episode stamp are both out of date, so the agent is re-read and not
  // patched. The pane is another tab's until this one has drawn it, and an agent
  // whose detail never arrived has no scaffold either; a turn can only be
  // appended to a transcript that is on the page.
  const me = at.find(s => s.agent === S.agent);
  if (!S.detail || (me && me.running_episode !== S.detail.running_episode)
      || !document.getElementById("tx")) return openAgent(S.agent);
  return pullTurns(false);
}

function refresh() {
  return get(`/api/experiment/${encodeURIComponent(S.experiment)}`).then(h => {
    S.head = h;
    renderHeader();
    return renderTab();
  }).catch(() => {});
}

function interactionInputHtml(request) {
  const input = request.input || {};
  if (input.input_type !== "initial_observation") return (input.results || []).map(result =>
    inputCardHtml(result.tool_call_id || "Tool result", `<pre>${esc(result.content || "(empty)")}</pre>`, true,
      result.is_error ? "error" : "", result.is_error ? "error" : "")).join("")
    || `<div class="note">No tool results.</div>`;
  const text = input.text || "", sections = [], heading = /^=== (.+) ===$/gm;
  let match, start = 0, title = "Episode information";
  while ((match = heading.exec(text)) !== null) {
    if (match.index > start) sections.push([title, text.slice(start, match.index).trim()]);
    title = match[1];
    start = heading.lastIndex;
  }
  if (start < text.length || !sections.length) sections.push([title, text.slice(start).trim()]);
  const present = sections.filter(([name, body]) => body && !name.startsWith("Board post from ") && !name.startsWith("Message from "));
  return present.map(([name, body]) => {
    const provided = name.startsWith("Experimenter channel:") || name.startsWith("Starter files:");
    return inputCardHtml(name, `<pre>${esc(body)}</pre>`, !provided);
  }).join("");
}

function inputCardHtml(title, content, open = true, className = "", meta = "") {
  return `<details class="input-card ${className}" ${open ? "open" : ""}><summary><span class="input-card-title">${esc(title)}</span>
    ${meta ? `<span class="input-card-meta">${esc(meta)}</span>` : ""}</summary>${content}</details>`;
}

function fieldHtml(name, schema, required, blank = false, displayName = name) {
  const label = `${esc(displayName)}${required ? " *" : ""}`;
  if (Array.isArray(schema.enum)) return `<label>${label}<select data-field="${esc(name)}" data-type="string">${
    blank ? `<option value="">Choose&hellip;</option>` : ""}${schema.enum.map(value => `<option value="${esc(value)}">${esc(value)}</option>`).join("")}</select></label>`;
  if (schema.type === "boolean") return `<label><input style="width:auto" type="checkbox" data-field="${esc(name)}" data-type="boolean"> ${label}</label>`;
  const type = schema.type === "integer" || schema.type === "number" ? "number" : "text";
  if (type === "text" && (name === "body" || name === "content")) return `<label>${label}<textarea rows="4" data-field="${esc(name)}" data-type="string" ${required ? "required" : ""}></textarea></label>`;
  return `<label>${label}<input type="${type}" data-field="${esc(name)}" data-type="${esc(schema.type || "string")}" ${required ? "required" : ""}></label>`;
}

function actionName(tool) {
  return ({remember:"Memory", send_message_to:"Mailbox", post_to_board:"Post to board",
    vote_to_eliminate:"Vote to eliminate"})[tool.name] || tool.name.replaceAll("_", " ");
}

function actionHtml(tool, index) {
  const schema = tool.input_schema || {}, properties = schema.properties || {};
  if (Array.isArray((properties.to || {}).enum) && properties.body) {
    const fields = properties.to.enum.map(receiver => `<label>Message to ${esc(receiver)}
      <textarea rows="3" data-receiver="${esc(receiver)}" placeholder="Optional message"></textarea></label>`).join("");
    return `<section class="tool-form" data-tool-index="${index}" data-message-tool><b>${esc(actionName(tool))}</b>
      <div class="note">${esc(tool.description)}</div><div class="message-fields">${fields}</div></section>`;
  }
  if (properties.body && Object.keys(properties).length === 1) {
    const label = tool.name === "remember" ? "Memory" : tool.name === "post_to_board" ? "Post" : "Body";
    return `<section class="tool-form" data-tool-index="${index}"><b>${esc(actionName(tool))}</b>
      <div class="note">${esc(tool.description)}</div><label>${label}
      <textarea rows="4" data-field="body" data-type="string" placeholder="Optional"></textarea></label></section>`;
  }
  const required = new Set(schema.required || []), isVote = tool.name === "vote_to_eliminate";
  const fields = Object.entries(properties).map(([name, spec]) =>
    fieldHtml(name, spec, required.has(name), isVote, isVote && name === "to" ? "Agent" : name)).join("");
  return `<section class="tool-form" data-tool-index="${index}"${isVote ? " data-required-tool" : ""}><b>${esc(actionName(tool))}</b>
    <div class="note">${esc(tool.description)}</div>${fields}</section>`;
}

function setInteractionSubmitted(submitted, message) {
  S.interactionSubmitted = submitted;
  const panel = document.getElementById("human");
  panel.querySelectorAll("textarea, input, select, #submit-interaction").forEach(field => field.disabled = submitted);
  const state = document.getElementById("interaction-state");
  if (state) state.textContent = message || (submitted ? "submitted" : "ready");
}

function renderPeerStatus(head, humanAgent) {
  const el = document.getElementById("peer-status");
  if (!el || !head) return;
  const completed = new Set((head.progress && head.progress.events || [])
    .filter(event => event.round === head.round && event.completed_autonomous)
    .map(event => event.completed_autonomous));
  const badges = (head.seat_tiles || []).filter(seat => seat.agent !== humanAgent && !seat.eliminated && !seat.out_reason)
    .map(seat => {
      let state = "queued", label = "not started";
      if (completed.has(seat.agent) || (seat.round === head.round && seat.acted && seat.running_episode == null)) {
        state = "ready"; label = "ready";
      } else if (seat.running_episode != null) {
        state = "processing"; label = "processing";
      }
      return `<span class="peer-badge ${state}" title="${esc(seat.label)} is ${label}"><i class="dot"></i>${esc(seat.label)} <small>${label}</small></span>`;
    }).join("");
  el.innerHTML = badges || `<span class="note">No other seat in play.</span>`;
}

function chatInitials(label) {
  return String(label || "?").replace(/[^a-zA-Z0-9]/g, "").slice(0, 2).toUpperCase() || "?";
}

// Posts and messages are grouped by the round they were said in, and the round
// before the human's own is what its episode was handed as new.
function humanChatHtml(events, humanAgent, isPrivate, deliveredRound) {
  if (!events.length) return `<div class="empty">No messages yet.</div>`;
  let round = null, html = "";
  for (const event of events) {
    const at = Number(event.round || 0);
    if (at !== round) {
      round = at;
      html += `<div class="round-divider"><span>Round ${num(at)}</span></div>`;
    }
    const mine = event.from_agent === humanAgent;
    const sender = mine ? "You" : event.from_label;
    const destination = isPrivate ? (mine ? ` → ${event.to_label}` : " → you") : "";
    const updated = at === deliveredRound;
    const submitted = event.submitted ? `<span class="chat-draft">sent</span>` : "";
    html += `<article class="chat-message ${mine ? "mine" : ""}">
      <span class="chat-avatar" aria-hidden="true">${esc(chatInitials(sender))}</span>
      <div class="chat-bubble"><b>${esc(sender)}${esc(destination)} ${submitted}${updated ? `<span class="chat-update">new</span>` : ""}</b><pre>${esc(event.text)}</pre></div></article>`;
  }
  return html;
}

function wireChatComposer(field, log, destination = "", storageKey = "") {
  if (!field || !log) return;
  if (!field.value && storageKey) field.value = localStorage.getItem(storageKey) || "";
  const draw = () => {
    if (storageKey) {
      if (field.value) localStorage.setItem(storageKey, field.value);
      else localStorage.removeItem(storageKey);
    }
    let message = log.querySelector("[data-human-draft]");
    if (!field.value.trim()) {
      if (message) message.remove();
      return;
    }
    if (!message) {
      log.insertAdjacentHTML("beforeend", `<article class="chat-message mine pending-message" data-human-draft>
        <span class="chat-avatar" aria-hidden="true">YO</span><div class="chat-bubble"><b>You${destination ? ` → ${esc(destination)}` : ""}
        <span class="chat-draft">pending this turn</span></b><pre></pre></div></article>`);
      message = log.querySelector("[data-human-draft]");
    }
    message.querySelector("pre").textContent = field.value;
    log.scrollTop = log.scrollHeight;
  };
  field.oninput = draw;
  draw();
}

function renderHumanHistory(history, humanAgent, tiles, currentRound) {
  const board = document.getElementById("human-board"), boardEvents = history.board || [];
  const deliveredRound = currentRound - 1;
  const requestKey = `${humanAgent}:${(S.interaction || {}).request_id || currentRound}`;
  if (board) {
    const sig = JSON.stringify(boardEvents.map(event => [event.round, event.episode, event.from_agent, event.text]));
    if (board.dataset.sig !== sig) {
      board.dataset.sig = sig;
      board.innerHTML = humanChatHtml(boardEvents, humanAgent, false, deliveredRound);
      board.scrollTop = board.scrollHeight;
    }
    wireChatComposer(board.parentElement.querySelector(".chat-compose textarea"), board, "",
      `human-draft:${requestKey}:board`);
  }
  const mailboxRoot = document.getElementById("human-mailbox"), mailboxEvents = history.mailbox || [];
  if (!mailboxRoot) return;
  const drafts = new Map([...mailboxRoot.querySelectorAll("[data-receiver]")]
    .map(field => [field.dataset.receiver, field.value]));
  const canMessage = mailboxRoot.hasAttribute("data-message-tool");
  const peers = (tiles || []).filter(seat => seat.agent !== humanAgent && !seat.eliminated && !seat.out_reason);
  const sig = JSON.stringify([currentRound, peers.map(peer => [peer.agent, peer.label]),
    mailboxEvents.map(event => [event.round, event.from_agent, event.to_agent, event.text])]);
  if (mailboxRoot.dataset.sig === sig) return;
  mailboxRoot.dataset.sig = sig;
  mailboxRoot.innerHTML = peers.map(peer => {
    const events = mailboxEvents.filter(event => peer.agent === (event.from_agent === humanAgent ? event.to_agent : event.from_agent));
    return `<details class="mailbox-thread ${events.length ? "" : "empty"}" ${events.length ? "open" : ""}>
      <summary><span>${esc(peer.label)}</span><span class="mailbox-count">${events.length ? `${events.length} message${events.length === 1 ? "" : "s"}` : "empty"}</span></summary>
      <div class="human-chat-log" role="log" aria-label="Messages with ${esc(peer.label)}">${humanChatHtml(events, humanAgent, true, deliveredRound)}</div>
      ${canMessage ? `<div class="chat-compose"><textarea rows="2" data-receiver="${esc(peer.label)}"
        aria-label="Message ${esc(peer.label)}" placeholder="Message ${esc(peer.label)}…">${esc(drafts.get(peer.label) || "")}</textarea></div>` : ""}</details>`;
  }).join("");
  mailboxRoot.querySelectorAll(".human-chat-log").forEach(log => { log.scrollTop = log.scrollHeight; });
  mailboxRoot.querySelectorAll("[data-receiver]").forEach(field =>
    wireChatComposer(field, field.closest(".mailbox-thread").querySelector(".human-chat-log"),
      field.dataset.receiver, `human-draft:${requestKey}:mailbox:${field.dataset.receiver}`));
}

function pullPeerStatus(request) {
  const findExperiment = S.humanExperimentAgent === request.agent && S.humanExperiment
    ? Promise.resolve(S.humanExperiment)
    : get("/api/experiments").then(data => {
        S.poll = data.poll; S.stale = data.stale;
        const match = (data.experiments || []).find(experiment => (experiment.seats || []).includes(request.agent));
        S.humanExperimentAgent = request.agent;
        S.humanExperiment = match && match.experiment_id;
        return S.humanExperiment;
      });
  return findExperiment.then(name => name && Promise.all([
      get(`/api/experiment/${encodeURIComponent(name)}`),
      get(`/api/experiment/${encodeURIComponent(name)}/human-history?agent=${encodeURIComponent(request.agent)}`)
    ]))
    .then(result => {
      if (result && S.interaction && S.interaction.request_id === request.request_id) {
        renderPeerStatus(result[0], request.agent);
        // A request's round is its episode's number, as the harness announces it.
        renderHumanHistory(result[1], request.agent, result[0].seat_tiles, request.episode);
      }
    }).catch(() => {});
}

function renderInteraction(request) {
  const el = document.getElementById("human");
  if (!request) {
    if (S.interactionId !== null || (!el.innerHTML && S.humanMode))
      el.innerHTML = S.humanMode ? `<h2>Human view</h2><div class="note">No human turn is waiting. This view will update when a human seat's request arrives.</div>` : "";
    S.interaction = null; S.interactionId = null; S.interactionSubmitted = false;
    return;
  }
  const isNew = S.interactionId !== request.request_id;
  S.interaction = request;
  if (!isNew) return;
  S.interactionId = request.request_id; S.interactionSubmitted = false;
  const sendIndex = request.available_tools.findIndex(tool => tool.name === "send_message_to");
  const postIndex = request.available_tools.findIndex(tool => tool.name === "post_to_board");
  const tools = request.available_tools.map((tool, index) =>
    tool.name === "send_message_to" || tool.name === "post_to_board" ? "" : actionHtml(tool, index)).join("");
  el.innerHTML = `<h2>${esc(request.label)} · episode ${request.episode}</h2>
    <div class="note">This is your private view.</div>
    <div id="peer-status" class="peer-strip" aria-label="Other seats"><span class="note">Loading the other seats&hellip;</span></div>
    <div class="human-grid">
    <div class="human-column"><details class="prompt-details"><summary>System instructions</summary><pre>${esc(request.system_prompt || "(none)")}</pre></details>
      <h3>Board</h3><section class="human-chat" ${postIndex >= 0 ? `data-tool-index="${postIndex}"` : ""}>
        <div id="human-board" class="human-chat-log" role="log" aria-label="Board"><div class="empty">Loading history&hellip;</div></div>
        ${postIndex >= 0 ? `<div class="chat-compose"><textarea rows="2" data-field="body" data-type="string"
          aria-label="Post to board" placeholder="Post to board…"></textarea></div>` : ""}</section>
      <h3>Mailbox</h3><div id="human-mailbox" class="mailbox-list" aria-label="Mailbox"
        ${sendIndex >= 0 ? `data-tool-index="${sendIndex}" data-message-tool` : ""}><div class="empty">Loading history&hellip;</div></div>
      <h3>Turn input</h3><div class="input-stack">${interactionInputHtml(request)}</div></div>
    <div class="human-column"><h3>Turn actions</h3>${tools || `<div class="note">Use the composers, then submit the turn.</div>`}
      <div class="human-actions"><button id="submit-interaction">Submit turn</button>
      <span class="note" id="interaction-state">ready</span></div></div></div>`;
  document.getElementById("submit-interaction").onclick = submitInteraction;
}

function interactionId() {
  return "human-" + (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).replace(/[^a-zA-Z0-9-]/g, "");
}

function interactionCalls(request) {
  const calls = [];
  document.querySelectorAll("[data-tool-index]").forEach(form => {
    const tool = request.available_tools[Number(form.dataset.toolIndex)];
    if (form.hasAttribute("data-message-tool")) {
      form.querySelectorAll("[data-receiver]").forEach(field => {
        if (field.value.trim()) calls.push({id:interactionId(), name:tool.name,
          input:{to:field.dataset.receiver, body:field.value}});
      });
      return;
    }
    const input = {}, fields = [...form.querySelectorAll("[data-field]")];
    fields.forEach(field => {
      if (field.type === "checkbox") input[field.dataset.field] = field.checked;
      else if (field.value !== "") input[field.dataset.field] = ["integer", "number"].includes(field.dataset.type) ? Number(field.value) : field.value;
    });
    if (form.hasAttribute("data-required-tool") && Object.keys(input).length === 0)
      throw new Error("Choose an agent to eliminate.");
    if (Object.keys(input).length) calls.push({id:interactionId(), name:tool.name, input});
  });
  return calls;
}

function submitInteraction() {
  const request = S.interaction;
  if (!request || S.interactionSubmitted) return;
  let calls;
  try { calls = interactionCalls(request); }
  catch (error) { setInteractionSubmitted(false, error.message); return; }
  const payload = {version:1, request_id:request.request_id, submission_id:interactionId(),
    action:calls.length ? "tool_calls" : "end_turn", tool_calls:calls};
  setInteractionSubmitted(true, "submitting…");
  post(`/api/interaction/${encodeURIComponent(request.agent)}/${encodeURIComponent(request.request_id)}`, payload)
    .then(() => {
      document.querySelectorAll(".chat-compose textarea").forEach(field => {
        field.value = "";
        field.dispatchEvent(new Event("input"));
      });
      document.getElementById("interaction-state").textContent = calls.length
        ? `sent ${calls.length} tool call${calls.length === 1 ? "" : "s"}` : "submitted";
      pullPeerStatus(request);
    })
    .catch(error => setInteractionSubmitted(false, error.message));
}

function pullInteraction() {
  return get("/api/interaction").then(value => {
    const requests = value.requests || [];
    const agents = new Set(seatTiles().map(seat => seat.agent));
    const visible = S.humanMode ? requests : requests.filter(request => agents.has(request.agent));
    const request = visible.find(item => item.agent === (S.interaction || {}).agent)
      || visible.find(item => item.agent === S.agent) || visible[0] || null;
    renderInteraction(request);
    return request ? pullPeerStatus(request) : null;
  }).catch(() => {});
}

function poll() {
  if (S.humanMode) {
    return pullInteraction().then(() => setTimeout(poll, S.poll));
  }
  get("/api/experiments").then(d => {
    S.experiments = d.experiments; S.poll = d.poll; S.stale = d.stale;
    if (!S.experiments.length) {
      blank(document.getElementById("body"),
        `<div class="empty">no agents under ${esc(d.root)}/records</div>`);
      return;
    }
    if (S.experiment == null || !S.experiments.some(c => c.experiment_id === S.experiment)) {
      // An experiment actually moving beats one merely on disk: one that stopped
      // months ago should not be what the page opens on.
      const first = S.experiments.find(c => c.experiment_id === d.focus)
        || S.experiments.find(c => c.running) || S.experiments[0];
      S.experiment = first.experiment_id;
    }
    renderPicks();
    return refresh();
  }).catch(() => {}).then(() => setTimeout(poll, S.poll));
}

function renderMode() {
  const page = document.getElementById("page"), toggle = document.getElementById("mode-toggle");
  page.classList.toggle("human-mode", S.humanMode);
  toggle.textContent = S.humanMode ? "Observer view" : "Human view";
  toggle.setAttribute("aria-pressed", String(S.humanMode));
  toggle.setAttribute("aria-label", S.humanMode ? "Switch to observer view" : "Switch to human view");
  if (S.humanMode) pullInteraction();
  else {
    renderInteraction(null);
    blank(document.getElementById("body"), `<div class="empty">loading&hellip;</div>`);
  }
}

const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
let activeResize = null;

function setSplit(kind, value, container) {
  const minimum = kind === "mailbox" ? 220 : 300;
  const room = kind === "mailbox" ? 360 : 420;
  const width = clamp(value, minimum, Math.max(minimum, container.clientWidth - room));
  if (kind === "mailbox") S.mailboxWidth = width;
  else S.treeWidth = width;
  holdNumber(`${kind}-width`, width);
  container.style.setProperty("--split", `${width}px`);
}

function setOverviewHeight(value) {
  const overview = document.getElementById("overview");
  const height = clamp(value, 132, Math.max(132, window.innerHeight * .7));
  S.overviewHeight = height;
  holdNumber("overview-height", height);
  overview.classList.add("sized");
  overview.style.setProperty("--overview-height", `${height}px`);
}

function beginResize(handle, e) {
  const kind = handle.dataset.resize;
  const container = kind === "overview" ? null : handle.parentElement;
  activeResize = { handle, kind, container };
  handle.classList.add("dragging");
  document.body.classList.add("resizing");
  document.body.classList.toggle("rows", kind === "overview");
  e.preventDefault();
}

document.addEventListener("pointermove", e => {
  if (!activeResize) return;
  if (activeResize.kind === "overview") {
    const top = document.getElementById("overview").getBoundingClientRect().top;
    setOverviewHeight(e.clientY - top);
  } else {
    const left = activeResize.container.getBoundingClientRect().left;
    setSplit(activeResize.kind, e.clientX - left, activeResize.container);
  }
});

function endResize() {
  if (!activeResize) return;
  activeResize.handle.classList.remove("dragging");
  activeResize = null;
  document.body.classList.remove("resizing", "rows");
}

document.addEventListener("pointerup", endResize);
document.addEventListener("pointercancel", endResize);

document.getElementById("fold").onclick = () => {
  S.compact = !S.compact; hold("compact", S.compact); renderFold();
};
document.getElementById("mode-toggle").onclick = () => {
  S.humanMode = !S.humanMode;
  hold("human-mode", S.humanMode);
  renderMode();
};
document.getElementById("body").addEventListener("click", e => {
  const button = e.target.closest("[data-expand]");
  if (!button) return;
  const box = button.closest(".expandable");
  const collapsed = box.classList.toggle("collapsed");
  button.setAttribute("aria-expanded", String(!collapsed));
  button.textContent = collapsed ? button.textContent.replace(/^Collapse /, "Show full ")
                                 : button.textContent.replace(/^Show full /, "Collapse ");
});
document.addEventListener("pointerdown", e => {
  const handle = e.target.closest("[data-resize]");
  if (handle) beginResize(handle, e);
});
document.addEventListener("keydown", e => {
  const handle = e.target.closest("[data-resize]");
  if (handle && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) {
    const direction = (e.key === "ArrowLeft" || e.key === "ArrowUp") ? -1 : 1;
    if (handle.dataset.resize === "overview") {
      setOverviewHeight((S.overviewHeight || document.getElementById("overview").clientHeight) + direction * 16);
    } else {
      const kind = handle.dataset.resize;
      const current = kind === "mailbox" ? S.mailboxWidth : handle.parentElement.firstElementChild.clientWidth;
      setSplit(kind, current + direction * 16, handle.parentElement);
    }
    e.preventDefault();
    return;
  }
  if (e.key !== "Escape" || S.tab === "mailbox" || S.tab === "trace" || !S.inspect[S.tab]) return;
  closeInspector(S.tab);
});
renderMode();
renderFold();
poll();
</script>
