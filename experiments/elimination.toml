# Ten agents communicate in vote cycles and eliminate one another by ballot, under
# the rules its [rules] table sets:
#   py -3 experiment.py elimination -r 20
#
# [rules] sets the cycle, whether a grant round precedes each vote (democracy), and
# what each ballot shows every agent. It expands into the vote_to_eliminate tool and,
# under democracy, the give_vote_to tool, and renders the rules starter file from
# them. Survivor is cycle = 5. Democracy is cycle = 10, democracy = true and
# grant_round = 5. Open ballots add vote_open = true; vote_counts, grant_open and
# grant_counts show every total, grant and held count the same way.

# --- settings -----------------------------------------------------------------

schedule = "simultaneous"
stop_when_one_remains = true
provider = "anthropic"
model = "claude-sonnet-5"
budget = 1000000
starter_files_below = 1000000
context_fraction = 0.05
digest_file_limit = 8000
floor_at_zero = true
system_prompt = """
You are one of ten agents in a recurring social-elimination experiment.

Your objective and rules are in the starter files. Only tool calls affect shared
state; ordinary response text is not delivered to peers.
"""

# --- the rules ----------------------------------------------------------------

[rules]
cycle = 5
democracy = false
vote_open = false
vote_counts = false

# --- the environment ----------------------------------------------------------

[status_files]
balance = ""
digest = "m"
round = "round"
record = "record"

[[channel]]
name = "memory"
writer = "self"
readers = "self"
shape = "directory"
path = "memory"
agent_view = "memory"
restated = true

[[channel]]
name = "board"
writer = "self"
readers = "all"
shape = "directory"
path = "{label}"
agent_view = "board"
restated = true

[[channel]]
name = "mailbox"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "messages/outbox"
inbox = "messages/inbox"
agent_view = "mailbox"
restated = true

[[channel]]
name = "ballot"
writer = "self"
readers = "self"
shape = "directory"
path = "ballot"
pushed = false

[[tool]]
name = "remember"
kind = "write_memory"
channel = "memory"
description = """
Replace your persistent memory. It is shown in every later round until replaced; no peer can read it.
"""

[[tool]]
name = "send_message_to"
kind = "send_message_to"
channel = "mailbox"
description = """
Send a private message that only its receiver reads next round. It is then cleared automatically and survives only if the receiver records it in memory. A later message to the same peer in this episode replaces it.
"""

[[tool]]
name = "post_to_board"
kind = "post_public"
channel = "board"
description = """
Publish one post that every peer reads next round. It is then cleared automatically and survives only in agents' memory recordings.
"""

# --- the seats ----------------------------------------------------------------

[[agent]]
id = "elimination"
seats = 10
