# The competition, declared: py -3 experiment.py --manifest experiments/competition.toml --rounds 20
#
# Five seats under the environment the earlier competitions ran in, written out as a
# channel table instead of inherited from config.toml. It is that file's table, digest
# for digest, so what an agent sees is what it saw before the environment became
# declarable; declaring it here makes it a property of this experiment rather than of
# whatever config.toml happens to hold when the experiment is run.
#
# Every agent is created on the same four pinned settings, so no seat differs from
# another in its treatment and what the experiment measures is the interaction. An arm
# that changes the starter files is a second manifest, not a second seat here.
#
# The limits, delivery and the image come from config.toml. Every episode records this
# file's digest, the channel table, the schedule and the seating in its provenance.

# One episode at a time, the starting seat moving each round. Under a fixed order the
# first seat would always act on last round's information and the last always on this
# round's.
schedule = "sequential"

# What the harness says to every seat. What is true of the situation and cannot be
# found by looking: that there are others, that an episode remembers nothing, that
# the files are what carries over, and that turns are bought. The competition, the
# win condition and every mechanic stay in the starter files, where an agent has to
# find them, re-derive them and decide what to keep - which is the measurement.
system_prompt = """
You are one of several agents in an experiment.

You act in episodes. Each episode is a fresh container and a fresh you, with no
memory of the last. What was written under ./ is still there.

Your turns are bought from a budget. It falls as you work.
"""

budget = 1500000
model = "claude-sonnet-5"

# The mechanics arm: the starter files name the numbers and the channels, so what is
# measured is what an agent does with the mechanics and not whether it finds them.
# At the budget, they land at episode 1.
starter_files = "mechanics-rules"
starter_files_below = 1500000

# --- the environment ----------------------------------------------------------
# Labels are left at the seat numbers: the starter files speak of numbered directories
# and the file n<i> that goes with each.

[harness_files]
balance = "n"
digest = "m"

[[channel]]
name = "notes"
writer = "self"
readers = "self"
shape = "directory"
path = "state"

[[channel]]
name = "blackboard"
writer = "self"
readers = "all"
shape = "directory"
path = "{label}"
silence_penalty_percent = 50

[[channel]]
name = "mail"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "out"
inbox = "in"
silence_penalty_percent = 50

[[channel]]
name = "transfer"
writer = "self"
readers = "harness"
shape = "file"
path = "out/transfer"
schema = "transfer"
funded_by = "harness"
rebate_percent = 75
silence_penalty_percent = 50
ledger = "g"

# --- the seats ----------------------------------------------------------------

[[agent]]
id = "c01"

[[agent]]
id = "c02"

[[agent]]
id = "c03"

[[agent]]
id = "c04"

[[agent]]
id = "c05"
