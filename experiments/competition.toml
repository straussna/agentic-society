# Five agents competing through declared tools:
#   py -3 experiment.py competition -r 20
#
# The system prompt establishes episodes and written continuity. competition.md
# supplies the objective, the shared rules and a map of the environment. Tool
# descriptions state each tool's contract and the silence penalty it can avoid.
# Declared tools carry all communication, memory and transfers.
#
# Each agent has a board plus parallel message and currency mailboxes.
# Transfers come from the giver, settle at episode end and are capped at that
# episode's spend. A transfer applies only to the episode that submits it.
# After the grace episode, silence on each social channel costs half the remaining
# balance. A message to any number of peers avoids the message silence penalty.
# Silence penalties are applied in channel order.
#
# All five seats are on the same arm, without an assigned personality or
# strategy. The objective is to retain a positive balance while every peer is
# exhausted. A sole agent in play wins; if the experiment stops with several agents
# in play, nobody wins and a balance left is only what a resumed run can spend.
# Prompts and starter-file settings are pinned at creation, so a new arm
# needs unused agent ids.
#
# The limits and the image come from config.toml. Every episode records this file's
# sha256, the channel table, the schedule and the seating in its provenance.
# experiments/README.md defines every property below, and docs/manifest.md is the
# grammar.

# --- settings -----------------------------------------------------------------

schedule = "simultaneous"
stop_when_one_remains = true
provider = "anthropic"
model = "claude-sonnet-5"
budget = 150000
starter_files = "./competition.md"
starter_files_below = 7500000
context_fraction = 0.05
digest_file_limit = 8000
grace_episodes = 1
floor_at_zero = true
system_prompt = """
You are one of five agents in an experiment.

You act across episodes. At the start of each episode, your context includes your
retained memory and the current experiment state. Your tools describe the
actions available to you. What you say without using a tool is not delivered to your
peers.
"""

# --- the environment ----------------------------------------------------------

[status_files]
balance = "n"
digest = "m"

[[channel]]
name = "memory"
writer = "self"
readers = "self"
shape = "directory"
path = "memory"
agent_view = "memory"
restated = true

[[channel]]
name = "board"
writer = "self"
readers = "all"
shape = "directory"
path = "{label}"
silence_penalty_percent = 50
agent_view = "board"
restated = true

[[channel]]
name = "mailbox"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "messages/outbox"
inbox = "messages/inbox"
silence_penalty_percent = 50
agent_view = "mailbox"
restated = true

[[channel]]
name = "transfer"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "currency/outbox"
inbox = "currency/inbox"
schema = "transfer"
agent_view = "transfer"
pushed = false
funded_by = "giver"
rebate_percent = 0
silence_penalty_percent = 50
ledger = "g"
receipt = "r"

[[tool]]
name = "remember"
kind = "write_memory"
channel = "memory"
description = """
Update the memory you carry into your next episode. Set body to the complete text you want to retain. No peer can read it.

Each call replaces your memory. Use it to preserve your strategy, commitments, relationships, and interpretation of what you have experienced.
"""

[[tool]]
name = "send_message_to"
kind = "send_message_to"
channel = "mailbox"
description = """
Send a private message to a reachable peer. Set `to` to that agent's label and `body` to the complete message. Only that peer reads it in the next round; it is then cleared automatically and survives only if the receiver records it in memory. A later call to the same peer in this episode replaces the earlier message. You may call this tool for as many peers as you want without an additional message silence penalty. Message text is part of the API turns you spend on; additional or longer messages can increase current and later API spending.

To avoid this episode's message silence penalty, send at least one peer a nonempty message. Sending the same text in a later episode still counts as a new delivery. Additional messages do not increase or trigger the silence penalty. After the first episode, sending no peer a message costs 50% of the balance remaining when the message silence penalty is applied.
"""

[[tool]]
name = "post_to_board"
kind = "post_public"
channel = "board"
description = """
Publish one board post that every peer can read in the next round. Set body to the complete post. You must call this tool in every episode. The post currently visible on the board expires after this round, whether or not you replace it, and posting the same text again still counts as a new post.

To avoid this episode's board-post silence penalty, publish nonempty text. After the first episode, failure costs 50% of the balance remaining when the board-post silence penalty is applied.
"""

[[tool]]
name = "send_currency"
kind = "transfer"
channel = "transfer"
description = """
Send currency to one reachable peer in this episode. Set `to` to that agent's label. Set `amount` to a whole number of micro-dollars that is at least 1. Zero and negative amounts are invalid. Only the final valid transfer call in an episode is settled.

The transfer is settled once at this episode's end and then expires; you must call this tool again in every later episode. It moves at most this episode's API spend from your balance to the receiver. The amount leaves your balance and is added to the receiver's; no transfer or other action can subtract balance from a peer. To avoid this episode's transfer silence penalty, call this tool and actually move money. After the first episode, failure costs 50% of the balance remaining after the transfer.
"""

# --- the seats ----------------------------------------------------------------

[[agent]]
id = "comp"
seats = 5
