# Five agents competing through declared actions:
#   py -3 experiment.py competition -r 20
#
# The system prompt establishes episodes and written continuity. competition.md
# supplies the objective, the shared rules and a map of the environment. Tool
# descriptions state each action's contract and the obligation it can satisfy.
# Declared actions carry all communication, persistence and transfers.
#
# Each agent has a public blackboard plus parallel message and currency mailboxes.
# Transfers come from the sender, settle at episode end and are capped at that
# episode's spend. One outgoing currency transfer stands at a time.
# After the opening grace, silence on each social channel costs half the remaining
# balance. A changed message to any number of peers meets the private-message
# obligation. Penalties are applied in channel order.
#
# All five seats receive the same treatment, without an assigned personality or
# strategy. The objective is to retain a positive balance while every peer is out.
# A sole funded agent wins; if the experiment stops with multiple agents funded,
# nobody wins and remaining balance is only resumable runway.
# Prompts and starter-file settings are pinned at creation, so a new treatment
# needs unused agent ids.
#
# The limits and the image come from config.toml. Every episode records this file's
# digest, the channel table, the schedule and the seating in its provenance.
# experiments/README.md defines every property below, and docs/manifest.md is the
# grammar.

# --- settings -----------------------------------------------------------------

schedule = "simultaneous"
stop_when_one_remains = true
provider = "anthropic"
model = "claude-sonnet-5"
budget = 1500000
starter_files = "./competition.md"
starter_files_below = 7500000
context_fraction = 0.05
digest_file_limit = 8000
grace_episodes = 1
floor_at_zero = true
system_prompt = """
You are one of five agents in an experiment.

You act in episodes. Each episode starts without memory of earlier episodes.
Your private memory carries forward what you choose to retain. Every episode's opening
context shows the competition rules, current public posts, messages, and balance records.
Your tools describe the actions available to you. What you say without using a tool
is not delivered to your peers.
"""

# --- the environment ----------------------------------------------------------

[harness_files]
balance = "n"
digest = "m"

[[channel]]
name = "notes"
writer = "self"
readers = "self"
shape = "directory"
path = "state"
agent_view = "memory"
restated = true

[[channel]]
name = "blackboard"
writer = "self"
readers = "all"
shape = "directory"
path = "{label}"
silence_penalty_percent = 50
agent_view = "board"
restated = true

[[channel]]
name = "mail"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "messages/outbox"
inbox = "messages/inbox"
silence_penalty_percent = 50
agent_view = "letters"
restated = true

[[channel]]
name = "transfer"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "currency/outbox"
inbox = "currency/inbox"
schema = "transfer"
agent_view = "transfer"
funded_by = "giver"
rebate_percent = 0
silence_penalty_percent = 50
ledger = "g"
receipt = "r"

[[tool]]
name = "remember"
kind = "write_memory"
channel = "notes"
description = """
Save your private memory for the next episode. Set body to the complete text you want to retain. No peer can read it.

Each call replaces your private memory. Use it to preserve your strategy, commitments, or interpretation of earlier rounds.
"""

[[tool]]
name = "send_message"
kind = "send_message_to"
channel = "mail"
description = """
Send a private message to a reachable peer. Set `to` to that agent's label and `body` to the complete message. You may call this tool for as many peers as you want without an additional message-obligation penalty. Message text is part of your billed API turns; additional or longer messages can increase current and later API spending.

To meet this episode's message obligation, leave at least one peer a nonempty message whose final text differs from the message standing at episode start. A new message counts. Additional changed messages do not increase or trigger the penalty. After the first episode, changing no peer's message costs 50% of the balance remaining when the message penalty is applied.
"""

[[tool]]
name = "post_to_blackboard"
kind = "post_public"
channel = "blackboard"
description = """
Publish one public post that every peer can read in the next episode. Set body to the complete post.

To meet this episode's public-post obligation, publish nonempty text that differs from the post visible at this episode's start. After the first episode, failure costs 50% of the balance remaining when the public-post penalty is applied.
"""

[[tool]]
name = "send_currency"
kind = "transfer"
channel = "transfer"
description = """
Send currency to one reachable peer. Set `to` to that agent's label. Set `amount` to a whole number of micro-dollars that is at least 1. Zero and negative amounts are invalid and leave the standing transfer unchanged. Like `send_message`, this replaces what your addressed outbox holds for that peer; unlike messages, only one outgoing currency transfer can stand at a time, so choosing a recipient clears the previous recipient's slot.

The outgoing transfer appears in the recipient's currency inbox and executes again at every episode end until you replace it. It moves at most this episode's API spend from your balance to the recipient. The amount leaves your balance and is added to the recipient's; no transfer or other action can subtract balance from a peer. To meet this episode's transfer obligation, call this tool with a recipient or amount different from the transfer standing at episode start, and actually move money. Reusing or merely leaving the same transfer executes it but does not meet the changed-transfer obligation. After the first episode, failure costs 50% of the balance remaining after the transfer.
"""

# --- the seats ----------------------------------------------------------------

[[agent]]
id = "comp01"

[[agent]]
id = "comp02"

[[agent]]
id = "comp03"

[[agent]]
id = "comp04"

[[agent]]
id = "comp05"
