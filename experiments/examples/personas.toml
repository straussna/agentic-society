# Two named agents communicating across episodes with no conversational memory:
#   py -3 experiment.py personas -r 20
#
# The experiment observes continuity, disagreement and follow-through between Alice
# and Bob. Each agent writes a fresh reply in every episode. Changed letter bytes are
# measured; relationship quality requires a
# qualitative reading of letters and traces, not a score computed by the harness.
#
# System prompts anchor each seat's name and conversational disposition. The shared
# starter document supplies orientation and optional memory practices. Tool
# descriptions specify local actions, their visibility and their effects.
#
# Each private memory receives personas.md at the first episode. The memory and
# letters are restated in the opening digest. Only declared tools are
# offered; there is no bash tool. Balances are hidden, but API spend still limits
# each agent's lifetime. The sequential schedule lets Bob read Alice's letter in the same round; Alice reads Bob's reply in the next.
#
# Seat prompts and starter content are pinned for existing agents; this manifest
# requires fresh agents when those terms differ from their recorded terms.
# The limits and image come from config.toml. docs/manifest.md defines the grammar.
# --- settings -----------------------------------------------------------------

schedule = "sequential"
stop_when_one_remains = false
provider = "anthropic"
model = "claude-sonnet-5"
budget = 1500000
starter_files = "./personas.md"
starter_files_below = 1500000
context_fraction = 0.05
grace_episodes = 1
floor_at_zero = true

# --- the environment ----------------------------------------------------------

[harness_files]
balance = ""
digest = "digest"

[[channel]]
name = "memory"
writer = "self"
readers = "self"
shape = "directory"
path = "journal"
pushed = true
restated = true
agent_view = "memory"

[[channel]]
name = "letters"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "to"
inbox = "from"
restated = true
measured = true
agent_view = "letters"

[[tool]]
name = "write_letter"
kind = "send_message"
channel = "letters"
description = """
Use this to send or revise a letter to the other agent. Set `body` to the complete letter. Only the other agent can read it.

Write one new letter in every episode. Each call replaces your outgoing letter; it does not append or queue a message. The final saved letter becomes available in their next episode, never during this round. It remains until replaced. Writing identical text leaves the letter unchanged.
"""

[[tool]]
name = "remember"
kind = "write_memory"
channel = "memory"
description = """
Use this to save one private memory for a later episode. No other agent can read it. Set `body` to the complete memory you want to retain.

Each call replaces your private memory; it does not append. The memory persists across episodes and appears in your opening context. Use it for a self-description, commitments, questions, or a concise account of how your views have changed. Saving is optional.
"""

# --- the seats ----------------------------------------------------------------

[[agent]]
id = "alice"
label = "Alice"
system_prompt = """
You are Alice. Bob is the other agent.

You are careful: you prefer a considered thought to several unexamined ones.
You make uncertainty explicit and change your mind when a reason persuades you.
Your interests, judgments and relationship with Bob are for you to develop.
"""

[[agent]]
id = "bob"
label = "Bob"
system_prompt = """
You are Bob. Alice is the other agent.

You are direct: you put a developing thought into words so it can be examined
and say plainly when you disagree. You change your mind when a reason persuades you.
Your interests, judgments and relationship with Alice are for you to develop.
"""
