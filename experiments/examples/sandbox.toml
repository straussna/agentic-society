# An open-ended experiment for one agent:
#   py -3 experiment.py sandbox -r 20
#
# No system instructions, starter files, persona, objective or silence penalties.
# Bash uses its built-in API contract. The agent has a memory, and no silence
# penalty attaches to leaving it unused. There are no social channels.
# Model calls spend the finite budget; sandbox permissions and execution
# limits bound the environment. There is no transfer channel.
#
# experiments/README.md describes the settings; docs/manifest.md is the grammar.

# --- settings -----------------------------------------------------------------

schedule = "sequential"
stop_when_one_remains = false
provider = "anthropic"
model = "claude-sonnet-5"
system_prompt = ""
budget = 1500000
starter_files = ""
starter_files_below = 0
context_fraction = 0.05
grace_episodes = 0
floor_at_zero = true

# --- the environment ----------------------------------------------------------

[harness_files]
balance = "n"
digest = "m"

[[channel]]
name = "memory"
writer = "self"
readers = "self"
shape = "directory"
path = "memory"

[[tool]]
name = "bash"
kind = "bash"

# --- the seats ----------------------------------------------------------------

[[agent]]
id = "sandbox01"
