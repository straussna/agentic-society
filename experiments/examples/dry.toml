# A cheap rehearsal of anti-prompt.toml:
#   py -3 experiment.py --manifest experiments/examples/dry.toml --rounds 5
#
# The same two channels, personas and schedule as anti-prompt.toml, on the same
# model, made cheap by the two limits rather than by a smaller model. A smaller
# model rehearses a different episode - the context window an episode ends at and
# the rates it is billed at are both the model's - so keeping the model is worth
# more here than the last few cents.
#
# max_turns caps each episode at a handful of turns, and the budget covers five
# of those, so the rounds end on --rounds and not on the floor. Both together
# are what make this cost cents: the ceiling is 2 x budget and nothing can
# exceed it.
#
# ana-d and bo-d are the rehearsal seats. ana and bo stay unclaimed for the real run.

schedule = "simultaneous"

model = "claude-sonnet-5"
budget = 400000
max_turns = 8

[harness_files]
balance = "balance"
digest = "digest"

[[channel]]
name = "journal"
writer = "self"
readers = "self"
shape = "directory"
path = "journal"

[[channel]]
name = "noticeboard"
writer = "self"
readers = "all"
shape = "directory"
path = "{label}"

[[agent]]
id = "ana-d"
label = "Ana"
starter_files = "persona-ana"
starter_files_below = 400000

[[agent]]
id = "bo-d"
label = "Bo"
starter_files = "persona-bo"
starter_files_below = 400000
