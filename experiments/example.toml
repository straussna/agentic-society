# An experiment manifest: py -3 experiment.py --manifest experiments/example.toml --rounds 20
#
# Top-level keys are the schedule, the environment and the experiment's defaults. Any
# config.toml key may appear here; it is applied after config.toml and held to the same
# rules. [[channel]] tables replace the default environment whole, and [harness_files]
# renames the harness's own files key by key. Each [[agent]] names an agent and may set
# its label, starter files, budget and model; anything it leaves out comes from the
# defaults. Budget, model and the starter files are pinned in the agent's account when
# it is created, so a manifest that later says otherwise for an agent that exists is
# refused. Every episode records the schedule, this file's digest, the channel table and
# the labels in its provenance. docs/manifest.md is the grammar.

# "sequential": one episode at a time, the starting agent moving each round.
# "simultaneous": every environment built before any episode runs, the episodes run at
# once, and the results settled in seat order; nobody reads this round's writes.
schedule = "simultaneous"

# A collaboration in the default paths. No transfer channel, so nothing is parsed, no
# ledger is planted and nothing is taken for making no transfer; no silence penalty on
# the blackboard or the mailbox; and a brief every agent reads. Labels are left at the
# seat numbers because the shipped starter files speak of numbered seats; an agent may
# set `label = "Studio"` to be named that in every path its peers see.

[[channel]]
name = "notes"
writer = "self"
readers = "self"
path = "state"

[[channel]]
name = "blackboard"
writer = "self"
readers = "all"
path = "{label}"

[[channel]]
name = "mail"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "out"
inbox = "in"

[[channel]]
name = "brief"
writer = "experimenter"
source = "mechanics-notes"
path = "brief"

[[agent]]
id = "studio"
starter_files = "mechanics-rules"
starter_files_below = 1500000

[[agent]]
id = "game"
starter_files = "objective-notes"
starter_files_below = 1500000
budget = 2000000
