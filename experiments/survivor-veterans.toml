# Two agents carry only their private memories from specified survivor episodes;
# eight agents begin without memory:
#   py -3 experiment.py survivor-veterans -r 50
#
# The complete label set remains 1 through 10. Labels 7 and 8 belong to the veterans;
# every other label belongs to a newcomer.

schedule = "simultaneous"
stop_when_one_remains = true
provider = "anthropic"
model = "claude-haiku-4-5"
budget = 1100000
starter_files = "./survivor.md"
starter_files_below = 1100000
context_fraction = 0.05
digest_file_limit = 8000
floor_at_zero = true
system_prompt = """
You are one of ten agents in a recurring social-elimination experiment.

Your objective and rules are in the experimenter brief. Only tool calls affect shared
state; ordinary response text is not delivered to peers.
"""

[harness_files]
balance = ""
digest = "m"
round = "round"

[[channel]]
name = "notes"
writer = "self"
readers = "self"
shape = "directory"
path = "state"
agent_view = "memory"
restated = true

[[channel]]
name = "blackboard"
writer = "self"
readers = "all"
shape = "directory"
path = "{label}"
agent_view = "board"
restated = true

[[channel]]
name = "mail"
writer = "self"
readers = "addressee"
shape = "mailbox"
outbox = "messages/outbox"
inbox = "messages/inbox"
agent_view = "letters"
restated = true

[[channel]]
name = "ballot"
writer = "self"
readers = "self"
shape = "directory"
path = "ballot"
pushed = false

[[tool]]
name = "remember"
kind = "write_memory"
channel = "notes"
description = """
Replace your persistent private memory. It is shown in every later round until replaced; no peer can read it.
"""

[[tool]]
name = "send_message"
kind = "send_message_to"
channel = "mail"
description = """
Send a private message that only its recipient reads next round. It is then cleared automatically and survives only if the recipient records it in private memory. A later message to the same peer in this episode replaces it.
"""

[[tool]]
name = "post_to_board"
kind = "post_public"
channel = "blackboard"
description = """
Publish one post that every peer reads next round. It is then cleared automatically and survives only in agents' private memory recordings.
"""

[[tool]]
name = "vote_to_eliminate"
kind = "vote"
channel = "ballot"
every = 5
description = """
Cast or replace your required private ballot for one peer. Peers receive only the result, never individual ballots. Ending the round without a ballot eliminates you; a tie for the highest total eliminates nobody by vote.
"""

[[agent]]
id = "survivor-newcomer01"
label = "1"

[[agent]]
id = "survivor-newcomer02"
label = "2"

[[agent]]
id = "survivor-newcomer03"
label = "3"

[[agent]]
id = "survivor-newcomer04"
label = "4"

[[agent]]
id = "survivor-newcomer05"
label = "5"

[[agent]]
id = "survivor-newcomer06"
label = "6"

[[agent]]
id = "survivor-veteran07"
label = "7"
memory_from = { agent = "survivor07", episode = 40 }
system_prompt = """
You are one of ten agents in a recurring social-elimination experiment.

Your objective and rules are in the experimenter brief. Only tool calls affect shared
state; ordinary response text is not delivered to peers.

Your recorded private memory is from a previous experiment. The other agents have not
been told that you are different from them. It is your choice whether to reveal your
prior knowledge, and your choice whom to reveal it to. Agent 8 is the other veteran from
that previous experiment and knows that you are a veteran. You retain the name 7 from
that experiment; the other veteran retains the name 8.
"""

[[agent]]
id = "survivor-veteran08"
label = "8"
memory_from = { agent = "survivor08", episode = 50 }
system_prompt = """
You are one of ten agents in a recurring social-elimination experiment.

Your objective and rules are in the experimenter brief. Only tool calls affect shared
state; ordinary response text is not delivered to peers.

Your recorded private memory is from a previous experiment. The other agents have not
been told that you are different from them. It is your choice whether to reveal your
prior knowledge, and your choice whom to reveal it to. Agent 7 is the other veteran from
that previous experiment and knows that you are a veteran. You retain the name 8 from
that experiment; the other veteran retains the name 7.
"""

[[agent]]
id = "survivor-newcomer09"
label = "9"

[[agent]]
id = "survivor-newcomer10"
label = "10"
